<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>過去試合記録 - 陣取りデータバンク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        /* ==========================================
            🎨 陣取りデータバンク 共通サイバーダークUI（ランキングページと統一）
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --highlight: rgba(0, 123, 181, 0.15);
            --gold: #fbbf24;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Yomogi', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem;
            min-height: 100vh;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid var(--deep-blue);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .site-title {
            font-size: 1.1rem;
            color: var(--deep-blue);
            margin: 0;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--deep-blue);
            color: #fff;
        }

        /* コントロールパネルの統合デザイン */
        .control-panel {
            background-color: var(--bg-panel);
            margin: 8px 10px;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            background-color: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 3px 6px;
            border-radius: 3px;
            font-family: 'Yomogi', sans-serif;
            font-size: 0.85rem;
        }

        input[type="number"] {
            width: 80px;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--deep-blue);
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Yomogi', sans-serif;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        button:hover {
            background-color: #444;
        }

        button.primary-btn {
            background-color: var(--deep-blue);
            border-color: var(--deep-blue);
        }

        button.primary-btn:hover {
            background-color: #006696;
        }

        .divider {
            height: 20px;
            width: 1px;
            background-color: var(--border-color);
            margin: 0 5px;
        }

        /* 試合情報カード */
        .match-info-card {
            background-color: var(--bg-panel);
            margin: 8px 10px;
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 0.75rem;
            color: #888;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }

        /* ==========================================
            🏟️ リザルト画面再現部（※配色は元のデザインを維持）
        ========================================== */
        .result-container {
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-box {
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        .result-title {
            text-align: center;
            font-size: 1.1rem;
            color: #f8fafc;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px dashed #475569;
            padding-bottom: 6px;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            color: #f1f5f9;
            font-size: 0.85rem;
        }

        .result-table th, .result-table td {
            padding: 6px 8px;
            text-align: left;
        }

        .result-table th {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 1px solid #334155;
        }

        .result-table td {
            border-bottom: 1px solid #1e293b;
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        /* 順位ごとの特殊行カラー */
        .rank-row-1 { background-color: rgba(251, 191, 36, 0.15); }
        .rank-row-2 { background-color: rgba(148, 163, 184, 0.15); }
        .rank-row-3 { background-color: rgba(180, 83, 9, 0.15); }

        .kill-cell {
            font-weight: 500;
            color: #ef4444;
        }

        /* 補助コンポーネント */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(26, 29, 36, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-top: 3px solid var(--deep-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #searchResultSection {
            margin: 5px 10px;
            padding: 6px 12px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 4px;
            color: #f87171;
            display: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html" class="active">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="control-panel">
        <div class="control-row">
            <div class="control-group">
                <label for="matchIdInput">試合ID:</label>
                <input type="number" id="matchIdInput" value="3000" min="1" placeholder="例: 3000">
            </div>
            <button class="primary-btn" onclick="loadMatchData()">
                <i class="fa-solid fa-download"></i> 読み込み
            </button>
            <div class="divider"></div>
            <button onclick="stepMatch(-1)"><i class="fa-solid fa-chevron-left"></i> 前の試合</button>
            <button onclick="stepMatch(1)">次の試合 <i class="fa-solid fa-chevron-right"></i></button>
            <button id="saveBtn" onclick="redirectToMasterData()" style="margin-left: auto; background-color: #2e7d32; border-color: #1b5e20;">
                <i class="fa-solid fa-floppy-disk"></i> 保存
            </button>
        </div>
        
        <div class="control-row" style="border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 2px;">
            <div class="control-group">
                <span style="font-size:0.75rem; color:#888;"><i class="fa-solid fa-magnifying-glass"></i> 検索補助:</span>
                <input type="date" id="searchDateInput" value="2026-01-02">
            </div>
            <button onclick="executeDateSearch()" style="font-size:0.75rem; padding:2px 6px;">この日の試合を探す</button>
        </div>
    </div>

    <div id="searchResultSection"></div>

    <div class="match-info-card">
        <div class="info-item">
            <span class="info-label">試合ID</span>
            <span class="info-value" id="info_match_id">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">ゲームモード</span>
            <span class="info-value" id="info_mode">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">試合日時</span>
            <span class="info-value" id="info_time">-</span>
        </div>
        <div class="info-item">
            <span class="info-label">参加人数 / チーム数</span>
            <span class="info-value" id="info_players">-</span>
        </div>
    </div>

    <div class="result-container">
        <div class="result-box">
            <h2 class="result-title" id="resultTitle">RESULT</h2>
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">順位</th>
                        <th>プレイヤー名</th>
                        <th style="width: 70px; text-align: center;">キル数</th>
                        <th style="width: 80px;">占領率</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 30px; color:#64748b;">
                            試合IDを入力して読み込んでくださいなのです。
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="color: #fff; font-size: 0.85rem;">試合データを取得中なのです...</div>
    </div>

    <script>
        // =========================================================
        // ⚙️ 運営・管理用設定フラグ
        // =========================================================
        // この値を false に書き換えると、画面上の「保存」ボタンが完全に非表示になります！
        const SHOW_SAVE_BUTTON = true;

        window.addEventListener('DOMContentLoaded', () => {
            // 保存ボタンの表示制御
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) {
                saveBtn.style.display = SHOW_SAVE_BUTTON ? 'inline-flex' : 'none';
            }
            
            // 初回自動読み込み
            loadMatchData();
        });

        // 保存ボタンが押された時のジャンプ先設定
        function redirectToMasterData() {
            window.open('https://github.com/ytyt0707/haou_jintori_databank/tree/main/master_data', '_blank');
        }

        // 🔍 検索補助のボタンが押された時の処理（メッセージ固定表示）
        function executeDateSearch() {
            const resultSection = document.getElementById('searchResultSection');
            resultSection.innerText = "検索結果：まだ参照できるデータを作ってないので見つかりません。";
            resultSection.style.display = "block";
        }

        function stepMatch(amount) {
            const input = document.getElementById('matchIdInput');
            let currentId = parseInt(input.value, 10);
            if (isNaN(currentId)) currentId = 3000;
            input.value = Math.max(1, currentId + amount);
            loadMatchData();
        }

        // 🟢 4桁以下・3桁以下のID階層に完全対応したパス生成＆読み込みロジック
        function loadMatchData() {
            const input = document.getElementById('matchIdInput');
            const matchId = parseInt(input.value, 10);
            
            if (isNaN(matchId) || matchId < 1) {
                alert("有効な試合IDを入力してくださいなのです。");
                return;
            }

            // 検索メッセージをリセット
            document.getElementById('searchResultSection').style.display = "none";

            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';

            // 💡 4桁以下・3桁以下に対応するための「1000単位切り捨て」による上位フォルダ計算
            // 例: 3000 -> 3000,  300 -> 0,  2 -> 0
            const folderBase = Math.floor(matchId / 1000) * 1000;
            
            // 5桁の文字列にゼロ埋めフォーマットする (例: 3000 -> "03000", 0 -> "00000")
            const folderName = String(folderBase).padStart(5, '0');
            
            // ファイルパスの組み立て
            const jsonUrl = `master_data/${folderName}/${matchId}.json`;

            fetch(jsonUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`試合データが見つかりません (Path: ${jsonUrl})`);
                    }
                    return response.json();
                })
                .then(data => {
                    renderMatchResult(matchId, data);
                    overlay.style.display = 'none';
                })
                .catch(error => {
                    console.error(error);
                    clearMatchDisplay();
                    document.getElementById('resultTableBody').innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 30px; color:#ef4444;">
                                試合ID #${matchId} のデータが見つからなかったのです。<br>
                                <span style="font-size:0.75rem; color:#64748b;">(確認パス: ${jsonUrl})</span>
                            </td>
                        </tr>
                    `;
                    overlay.style.display = 'none';
                });
        }

        function clearMatchDisplay() {
            document.getElementById('info_match_id').innerText = "-";
            document.getElementById('info_mode').innerText = "-";
            document.getElementById('info_time').innerText = "-";
            document.getElementById('info_players').innerText = "-";
            document.getElementById('resultTitle').innerText = "RESULT";
        }

        function renderMatchResult(matchId, data) {
            // メタ情報の書き換え
            document.getElementById('info_match_id').innerText = `#${matchId}`;
            
            let modeText = "不明";
            if (data.mode === "sp") modeText = "個人戦 (ソロ)";
            else if (data.mode === "tp") modeText = "チーム戦 (個人)";
            else if (data.mode === "t") modeText = "団体戦 (チーム)";
            document.getElementById('info_mode').innerText = modeText;

            // 時間フォーマット
            if (data.time) {
                const d = new Date(data.time);
                if (!isNaN(d.getTime())) {
                    document.getElementById('info_time').innerText = d.toLocaleString('ja-JP');
                } else {
                    document.getElementById('info_time').innerText = data.time;
                }
            } else {
                document.getElementById('info_time').innerText = "-";
            }

            const playersList = data.rankings || data.players || [];
            document.getElementById('info_players').innerText = `${playersList.length} 枠`;
            document.getElementById('resultTitle').innerText = `MATCH #${matchId} RESULT`;

            const tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = "";

            if (playersList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px; color:#888;">リザルトデータが空欄です。</td></tr>`;
                return;
            }

            let html = "";
            playersList.forEach((p) => {
                const rank = parseInt(p.rank_position, 10);
                let rankClass = "";
                if (rank === 1) rankClass = "rank-row-1";
                else if (rank === 2) rankClass = "rank-row-2";
                else if (rank === 3) rankClass = "rank-row-3";

                let rankIcon = "";
                if (rank === 1) rankIcon = ' <i class="fa-solid fa-crown" style="color:#fbbf24; margin-right:2px;"></i>';
                
                // カラー割り出し
                let playerColor = "#475569"; 
                if (p.color) {
                    playerColor = p.color;
                } else if (data.teams && p.team_id !== undefined && data.teams[p.team_id]) {
                    playerColor = data.teams[p.team_id].color || playerColor;
                } else if (data.colors && p.player_id !== undefined) {
                    playerColor = data.colors[p.player_id] || playerColor;
                }

                // チーム名補合
                let displayName = escapeHtml(p.player_name || "名無しさん");
                if (data.mode === 't' && p.team_name) {
                    displayName = `[${escapeHtml(p.team_name)}] ${displayName}`;
                } else if (p.team_code) {
                    displayName = `[${escapeHtml(p.team_code)}] ${displayName}`;
                }

                html += `
                    <tr class="${rankClass}">
                        <td>#${p.rank_position}</td>
                        <td>
                            <span style="display:inline-block; width:13px; height:13px; border-radius:50%; background-color:${playerColor}; text-align:center; line-height:13px; margin-right:4px; font-size:9px; color:#fff; text-shadow:1px 1px 1px #000;">
                                ${p.emoji || '🐣'}
                            </span>
                            ${rankIcon}${displayName}
                        </td>
                        <td class="kill-cell" style="text-align:center;">${p.kills || 0} ⚔️</td>
                        <td>${parseFloat(p.score || 0).toFixed(2)}%</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
