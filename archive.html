<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>過去試合記録 - 陣取りデータバンク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        /* ==========================================
            🎨 陣取りデータバンク 共通サイバーダークUI
        ========================================== */
        :root {
            /* ランキングページ (index.html) と完全に統一した配色 */
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --highlight: rgba(0, 123, 181, 0.15);
            --gold: #fbbf24;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Yomogi', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid var(--deep-blue);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .site-title {
            font-size: 1.1rem;
            color: var(--deep-blue);
            margin: 0;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--deep-blue);
            color: #fff;
        }

        .control-panel {
            background-color: var(--bg-panel);
            margin: 8px 10px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            background-color: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 3px 6px;
            border-radius: 3px;
            font-family: 'Yomogi', sans-serif;
        }

        input[type="number"] {
            width: 80px;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--deep-blue);
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Yomogi', sans-serif;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #444;
        }

        button.active {
            background-color: var(--deep-blue);
            border-color: var(--deep-blue);
        }

        .match-info {
            margin: 10px;
            padding: 10px;
            background-color: var(--bg-panel);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .match-info p {
            margin: 4px 0;
        }

        /* ==========================================
            🏟️ リザルト画面再現部（元の色・デザインを完全に維持）
        ========================================== */
        .result-container {
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result-box {
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        .result-title {
            text-align: center;
            font-size: 1.1rem;
            color: #f8fafc;
            margin: 0 0 10px 0;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 2px dashed #475569;
            padding-bottom: 6px;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            color: #f1f5f9;
            font-size: 0.85rem;
        }

        .result-table th, .result-table td {
            padding: 6px 8px;
            text-align: left;
        }

        .result-table th {
            color: #94a3b8;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 1px solid #334155;
        }

        .result-table td {
            border-bottom: 1px solid #1e293b;
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        .rank-row-1 { background-color: rgba(251, 191, 36, 0.15); }
        .rank-row-2 { background-color: rgba(148, 163, 184, 0.15); }
        .rank-row-3 { background-color: rgba(180, 83, 9, 0.15); }

        .kill-cell {
            font-weight: 500;
            color: #ef4444;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html" class="active">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <label>試合ID:</label>
            <input type="number" id="matchIdInput" value="3000">
            <button onclick="loadMatchData()">読み込み</button>
        </div>
        <button onclick="stepMatch(-1)">前の試合</button>
        <button onclick="stepMatch(1)">次の試合</button>
        <button id="saveBtn" onclick="saveMatchData()">保存</button>
        
        <div class="control-group" style="margin-left: 20px;">
            <label>検索補助:</label>
            <input type="date" id="searchDateInput" value="2026-01-02">
            <button onclick="searchMatchByDate()">検索</button>
        </div>
        <span id="searchStatus" style="margin-left: 10px; color: #ff4444;"></span>
    </div>

    <div class="match-info">
        <p>試合ID: <span id="info_match_id">-</span></p>
        <p>ゲームモード: <span id="info_mode">-</span></p>
        <p>試合日時: <span id="info_time">-</span></p>
        <p>プレイヤー数: <span id="info_players">-</span></p>
    </div>

    <div class="result-container">
        <div class="result-box">
            <h2 class="result-title" id="resultTitle">RESULT</h2>
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">順位</th>
                        <th>プレイヤー名</th>
                        <th style="width: 70px; text-align: center;">キル数</th>
                        <th style="width: 80px;">占領率</th>
                    </tr>
                </thead>
                <tbody id="resultTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 20px; color: #64748b;">
                            試合IDを入力して読み込んでください。
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ 表示・非表示設定フラグ
        // ==========================================
        // ここを false に書き換えるだけで、保存ボタンは綺麗に非表示になります
        const SHOW_SAVE_BUTTON = true;

        window.onload = function() {
            // 保存ボタンの非表示制御
            const saveBtn = document.getElementById('saveBtn');
            if (saveBtn) {
                saveBtn.style.display = SHOW_SAVE_BUTTON ? 'inline-block' : 'none';
            }
            loadMatchData();
        };

        // 保存ボタンを押した時の飛び先URL設定
        function saveMatchData() {
            window.location.href = "https://github.com/ytyt0707/haou_jintori_databank/tree/main/master_data";
        }

        // 検索補助ボタンが押された時の挙動
        function searchMatchByDate() {
            document.getElementById('searchStatus').innerText = "見つかりません";
        }

        function stepMatch(amount) {
            const input = document.getElementById('matchIdInput');
            let val = parseInt(input.value);
            if (isNaN(val)) val = 3000;
            input.value = val + amount;
            loadMatchData();
        }

        function loadMatchData() {
            const matchId = document.getElementById('matchIdInput').value;
            if (!matchId) return;

            // 💡 4桁以下・3桁以下に対応するための「1000単位切り捨て」による上位フォルダ計算
            const folderBase = Math.floor(parseInt(matchId) / 1000) * 1000;
            const folderName = String(folderBase).padStart(5, '0');
            
            // パス組み立て
            const url = `master_data/${folderName}/${matchId}.json`;

            fetch(url)
                .then(res => {
                    if(!res.ok) throw new Error("試合データが見つかりません");
                    return res.json();
                })
                .then(data => {
                    renderResultScreen(data, matchId);
                })
                .catch(err => {
                    document.getElementById('resultTableBody').innerHTML = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#ef4444;">データが見つかりません (${url})</td></tr>`;
                });
        }

        function renderResultScreen(data, matchId) {
            document.getElementById('info_match_id').innerText = matchId;
            document.getElementById('info_mode').innerText = data.mode || '-';
            document.getElementById('info_time').innerText = data.time || '-';
            
            const players = data.rankings || data.players || [];
            document.getElementById('info_players').innerText = players.length;
            document.getElementById('resultTitle').innerText = `MATCH #${matchId} RESULT`;

            const tbody = document.getElementById('resultTableBody');
            let html = '';

            if (players.length === 0) {
                html = `<tr><td colspan="4" style="text-align: center; padding: 20px; color: #64748b;">データが空です。</td></tr>`;
            } else {
                players.forEach(p => {
                    const rank = parseInt(p.rank_position);
                    let rankClass = '';
                    if (rank === 1) rankClass = 'rank-row-1';
                    else if (rank === 2) rankClass = 'rank-row-2';
                    else if (rank === 3) rankClass = 'rank-row-3';

                    let rankIcon = '';
                    if (rank === 1) rankIcon = '👑 ';

                    let playerColor = '#475569';
                    if (p.color) {
                        playerColor = p.color;
                    } else if (data.teams && p.team_id !== undefined && data.teams[p.team_id]) {
                        playerColor = data.teams[p.team_id].color || playerColor;
                    } else if (data.colors && p.player_id !== undefined) {
                        playerColor = data.colors[p.player_id] || playerColor;
                    }

                    // 元のコード通りの表示名組み立て
                    let displayName = escapeHtml(p.player_name || "名無しさん");
                    if (data.mode === 't' && p.team_name) {
                        displayName = `[${escapeHtml(p.team_name)}] ${displayName}`;
                    } else if (p.team_code) {
                        displayName = `[${escapeHtml(p.team_code)}] ${displayName}`;
                    }

                    html += `
                        <tr class="${rankClass}">
                            <td>#${p.rank_position}</td>
                            <td>
                                <span style="display:inline-block; width:13px; height:13px; border-radius:50%; background-color:${playerColor}; text-align:center; line-height:13px; margin-right:4px; font-size:9px; color:#fff; text-shadow:1px 1px 1px #000;">
                                    ${p.emoji || '🐣'}
                                </span>
                                ${rankIcon}${displayName}
                            </td>
                            <td class="kill-cell" style="text-align:center;">${p.kills || 0} ⚔️</td>
                            <td>${parseFloat(p.score || 0).toFixed(2)}%</td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
