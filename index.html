<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おんj陣取り 覇王軍特設データバンク</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           🎨 高密度サイバーダークUI（本家完全リスペクト）
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5; /* 少し暗めの落ち着いたブルー */
            --border-color: #333;
            --highlight: rgba(0, 123, 181, 0.15);
        }

        body {
            margin: 0;
            /* すべての文字をYomogiフォントに統一 */
            font-family: 'Yomogi', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem; /* 全体的に文字を小さく */
        }

        /* 🧭 ナビゲーションバー */
        header {
            background-color: #111;
            border-bottom: 1px solid var(--deep-blue); /* 線を細く（2px -> 1px） */
            padding: 6px 15px; /* 縦幅を圧縮 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .site-title {
            font-size: 1.1rem;
            color: var(--deep-blue);
            margin: 0;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--deep-blue);
            color: #fff;
        }

        /* 🎛️ コントロールパネル */
        .control-panel {
            background-color: var(--bg-panel);
            margin: 10px; /* 余白を削減 */
            padding: 8px 12px; /* 縦幅を圧縮 */
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* 🔍 検索バーをコンパクトに */
        input[type="text"] {
            background-color: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 4px 8px;
            border-radius: 3px;
            width: 200px;
            font-family: 'Yomogi', sans-serif;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--deep-blue);
        }

        button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Yomogi', sans-serif;
            font-size: 0.8rem;
        }

        button:hover { background-color: #444; }
        button.active { background-color: var(--deep-blue); border-color: var(--deep-blue); }

        /* 📊 ランキングテーブル（超高密度仕様） */
        .table-container {
            margin: 0 10px 10px 10px;
            overflow-x: auto;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem; /* 表内の文字を小さく */
            white-space: nowrap;
        }

        /* セルの余白を極限まで削って密度を上げる */
        th, td {
            padding: 3px 8px; /* 上下3px、左右8pxまで圧縮 */
            text-align: right;
            border-bottom: 1px solid #2a2a2a; /* 境界線を少し暗く */
        }

        th {
            background-color: #111;
            color: #999;
            font-weight: normal;
            position: sticky;
            top: 0;
            z-index: 10;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        th.col-left, td.col-left { text-align: left; }
        th.col-center, td.col-center { text-align: center; }

        tr:hover { background-color: var(--highlight); }

        /* 本家風：[チーム名]名前（灰色） */
        .player-name-format {
            color: #aaa; /* 本家仕様の灰色 */
            text-decoration: none;
        }
        .player-name-format a {
            color: #aaa;
            text-decoration: none;
        }
        .player-name-format a:hover {
            text-decoration: underline;
            color: #fff;
        }

        /* 順位バッジのコンパクト化 */
        .badge-rank { color: #888; font-size: 0.75rem; display: inline-block; width: 40px; }

        /* アイコンのツールチップ */
        .icon-wrapper { position: relative; display: inline-block; cursor: pointer; color: #aaa;}
        .icon-wrapper:hover .tooltip { display: block; }
        .tooltip {
            display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background: #000; border: 1px solid var(--deep-blue); padding: 3px 6px; border-radius: 3px;
            z-index: 100; white-space: nowrap; color: #fff; font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html" class="active">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <input type="text" id="searchInput" placeholder="🔍 名前で絞り込み..." onkeyup="filterTable()">
        </div>

        <div class="control-group" style="margin-left: 10px;">
            <button id="tab_personal" class="active" onclick="switchMode('personal')">個人</button>
            <button id="tab_team" onclick="switchMode('team')">チーム</button>
        </div>

        <div class="control-group" id="filter_type_group" style="margin-left: 10px;">
            <button class="active">すべて</button>
            <button>ソロ</button>
            <button>チーム</button>
        </div>

        <div class="control-group" style="margin-left: auto;">
            <button class="active">全期間</button>
            <button>本日</button>
            <button>直近7日間</button>
            <button title="カスタム期間指定">📅 期間指定</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-left" style="width: 80px;">順位(総合/検索)</th>
                    <th class="col-center" style="width: 30px;"></th> <th class="col-left">プレイヤー名</th>
                    <th>試合数</th>
                    <th>総占領面積 <span style="font-size:0.7rem;color:#777;">[最大]</span></th>
                    <th>総キル数 <span style="font-size:0.7rem;color:#777;">[最大]</span></th>
                    <th>キルレート</th>
                    <th class="col-center">初登場 / 最終活動</th>
                </tr>
            </thead>
            <tbody id="rankingBody">
                </tbody>
        </table>
    </div>

    <script>
        // 🧪 テスト用のダミーデータ
        const dummyData = [
            { rank_all: 1, name: "束音ロゼ", team: "ソロ", icon: "🌸", matches: 1250, wins: 450, total_area: 854000, max_area: 12500, total_kills: 3500, max_kills: 15, first_date: "24/01/10", last_date: "26/05/19" },
            { rank_all: 2, name: "名無しA", team: "🇯🇵ONJ", icon: "⚔️", matches: 980, wins: 210, total_area: 620000, max_area: 9800, total_kills: 1200, max_kills: 8, first_date: "24/02/15", last_date: "26/05/18" },
            { rank_all: 3, name: "破壊神", team: "ソロ", icon: "🔥", matches: 500, wins: 300, total_area: 400000, max_area: 15000, total_kills: 2000, max_kills: 22, first_date: "25/06/01", last_date: "26/05/19" },
            { rank_all: 4, name: "束音ロゼ", team: "🇯🇵ONJ", icon: "🌸", matches: 120, wins: 50, total_area: 95000, max_area: 11000, total_kills: 280, max_kills: 10, first_date: "26/01/01", last_date: "26/05/15" },
        ];

        window.onload = () => {
            renderTable(dummyData);
        };

        function renderTable(dataArray, searchQuery = "") {
            const tbody = document.getElementById('rankingBody');
            tbody.innerHTML = '';

            let searchRank = 1;

            dataArray.forEach(p => {
                if (searchQuery && !p.name.includes(searchQuery) && !p.team.includes(searchQuery)) return;

                const killRate = (p.total_kills / p.matches).toFixed(2);
                const analysisUrl = `analysis.html?name=${encodeURIComponent(p.name)}&team=${encodeURIComponent(p.team)}`;

                // 本家風フォーマット: チームが「ソロ」の場合はチーム名表記を省略するかどうか（今回は仕様通り[ソロ]表記にしています）
                const teamDisplay = p.team === "ソロ" ? "[ソロ]" : `[${p.team}]`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-left">
                        <span class="badge-rank">${p.rank_all}位</span>
                        ${searchQuery ? `<span class="badge-rank" style="color:var(--deep-blue);">(${searchRank}位)</span>` : '<span class="badge-rank"></span>'}
                    </td>
                    <td class="col-center">
                        <div class="icon-wrapper">
                            ${p.icon}
                            <div class="tooltip">よく使うアイコン</div>
                        </div>
                    </td>
                    <td class="col-left player-name-format">
                        ${teamDisplay}<a href="${analysisUrl}">${p.name}</a>
                    </td>
                    <td>${p.matches.toLocaleString()}</td>
                    <td>
                        ${p.total_area.toLocaleString()}%
                        <span style="font-size:0.7rem;color:#777;">[${p.max_area.toLocaleString()}%]</span>
                    </td>
                    <td>
                        ${p.total_kills.toLocaleString()}
                        <span style="font-size:0.7rem;color:#777;">[${p.max_kills.toLocaleString()}]</span>
                    </td>
                    <td>${killRate}</td>
                    <td class="col-center" style="font-size:0.75rem; color:#888;">
                        ${p.first_date} - ${p.last_date}
                    </td>
                `;
                tbody.appendChild(tr);
                searchRank++;
            });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.trim();
            renderTable(dummyData, query);
        }

        function switchMode(mode) {
            document.getElementById('tab_personal').classList.remove('active');
            document.getElementById('tab_team').classList.remove('active');
            document.getElementById('tab_' + mode).classList.add('active');
            document.getElementById('filter_type_group').style.display = (mode === 'personal') ? 'flex' : 'none';
        }
    </script>
</body>
</html>
