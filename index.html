<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おんj陣取り 覇王軍特設データバンク</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           🎨 超高密度サイバーダークUI
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --highlight: rgba(0, 123, 181, 0.15);
        }

        body {
            margin: 0;
            font-family: 'Yomogi', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid var(--deep-blue);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .site-title { font-size: 1.1rem; color: var(--deep-blue); margin: 0; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 15px; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--deep-blue); color: #fff; }

        .control-panel {
            background-color: var(--bg-panel);
            margin: 8px 10px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .control-group { display: flex; gap: 4px; align-items: center; }

        input[type="text"] {
            background-color: #111; border: 1px solid #555; color: #fff;
            padding: 3px 6px; border-radius: 3px; width: 180px; font-family: 'Yomogi', sans-serif;
        }
        input[type="text"]:focus { outline: none; border-color: var(--deep-blue); }

        button {
            background-color: #333; color: #fff; border: 1px solid #555;
            padding: 3px 8px; border-radius: 3px; cursor: pointer;
            font-family: 'Yomogi', sans-serif; font-size: 0.8rem;
        }
        button:hover { background-color: #444; }
        button.active { background-color: var(--deep-blue); border-color: var(--deep-blue); }

        select.dropdown-select {
            background-color: #111; border: 1px solid #555; color: #fff;
            padding: 3px 20px 3px 6px; border-radius: 3px; font-family: 'Yomogi', sans-serif;
            font-size: 0.8rem; cursor: pointer; appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 4px center; background-size: 12px;
        }
        select.dropdown-select:focus { outline: none; border-color: var(--deep-blue); }

        .table-wrapper { width: 100%; text-align: center; margin-top: 10px; }

        .table-container {
            overflow-x: auto; background-color: var(--bg-panel); border: 1px solid var(--border-color);
            display: inline-block; text-align: left;
        }

        table { width: auto; border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; }

        th, td { padding: 2px 12px; text-align: right; border-bottom: 1px solid #2a2a2a; }
        th { background-color: #111; color: #999; font-weight: normal; position: sticky; top: 0; z-index: 10; padding-top: 4px; padding-bottom: 4px; }
        th.col-left, td.col-left { text-align: left; }
        th.col-center, td.col-center { text-align: center; }
        tr:hover { background-color: var(--highlight); }

        .player-name-format { color: #aaa; text-decoration: none; }
        .player-name-format a { color: #aaa; text-decoration: none; }
        .player-name-format a:hover { text-decoration: underline; color: #fff; }

        .badge-rank { color: #888; font-size: 0.75rem; display: inline-block; width: 45px; }

        .icon-wrapper { position: relative; display: inline-block; cursor: pointer; color: #aaa;}
        .icon-wrapper:hover .tooltip { display: block; }
        .tooltip {
            display: none; position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            background: #000; border: 1px solid var(--deep-blue); padding: 3px 6px; border-radius: 3px;
            z-index: 100; white-space: nowrap; color: #fff; font-size: 0.75rem;
        }

        th:nth-child(1), td:nth-child(1) { padding-right: 2px !important; width: 110px !important; min-width: 110px !important; text-align: left !important; }
        th:nth-child(2), td:nth-child(2) { padding-left: 2px !important; padding-right: 2px !important; width: 16px !important; min-width: 16px !important; text-align: center !important; }
        th:nth-child(3), td:nth-child(3) { padding-left: 2px !important; }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html" class="active">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <input type="text" id="searchInput" placeholder="🔍 名前で絞り込み..." oninput="updateView()">
        </div>

        <div class="control-group" style="margin-left: 10px;">
            <button id="tab_personal" class="active" onclick="switchMode('personal')">個人</button>
            <button id="tab_team" onclick="switchMode('team')">チーム</button>
        </div>

        <div class="control-group" id="filter_type_group" style="margin-left: 10px;">
            <select id="filter_type" class="dropdown-select" onchange="updateView()">
                <option value="all">すべて合体</option>
                <option value="solo">ソロ戦のみ</option>
                <option value="team">チーム戦のみ</option>
            </select>
        </div>

        <div class="control-group" style="margin-left: 10px;">
            <select id="killrate_type" class="dropdown-select" onchange="updateView()" title="キルレート計算方式設定">
                <option value="normal">K/G (キル/試合数)</option>
                <option value="dummy1">K/D (キル/デス数・仮)</option>
                <option value="dummy2">K/R (キル率・仮)</option>
            </select>
        </div>

        <div class="control-group" style="margin-left: auto;">
            <button class="active">全期間</button>
            <button>本日</button>
            <button>直近7日間</button>
            <button>今月</button>
            <button title="カスタム期間指定">📅 期間指定</button>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="table-container">
            <table>
                <thead>
                    <tr style="user-select: none;">
                        <th class="col-left">順位(総合/検索)</th>
                        <th class="col-center"></th>
                        <th class="col-left" id="th_name" onclick="setSort('name')" style="cursor:pointer;">プレイヤー名</th>
                        <th id="th_wins" onclick="setSort('wins')" style="cursor:pointer; color:#ffd700;">1位回数</th> <th id="th_matches" onclick="setSort('matches')" style="cursor:pointer;">試合数</th>
                        <th id="th_total_area" onclick="setSort('total_area')" style="cursor:pointer;">総占領面積 <span style="font-size:0.7rem;color:#777;">[最大]</span></th>
                        <th id="th_total_kills" onclick="setSort('total_kills')" style="cursor:pointer;">総キル数 <span style="font-size:0.7rem;color:#777;">[最大]</span></th>
                        <th id="th_kill_rate" onclick="setSort('kill_rate')" style="cursor:pointer;">キルレート</th>
                        <th class="col-center">
                            <span id="th_last_date" onclick="setSort('last_date')" style="cursor:pointer;">最終活動</span> 
                            ～ 
                            <span id="th_first_date" onclick="setSort('first_date')" style="cursor:pointer;">初登場</span>
                        </th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                    <tr><td colspan="9" class="col-center" style="padding: 20px;">データをロード中なのです...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentMode = 'personal'; 
        let rawRankings = []; 
        let rawJsonUpdatedAt = ""; 

        let currentSortKey = 'total_area'; 
        let currentSortOrder = 'desc';     

        window.onload = () => {
            fetch('public_data/all_period/summary.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    rawJsonUpdatedAt = data.updated_at || "";
                    rawRankings = data.rankings || [];
                    updateView(); 
                })
                .catch(error => {
                    console.error('データの取得に失敗したのです:', error);
                    document.getElementById('rankingBody').innerHTML = 
                        `<tr><td colspan="9" class="col-center" style="color:#ff4444; padding:20px;">データの読み込みに失敗しました。</td></tr>`;
                });
        };

        function setSort(key) {
            if (currentSortKey === key) {
                currentSortOrder = currentSortOrder === 'desc' ? 'asc' : 'desc';
            } else {
                currentSortKey = key;
                currentSortOrder = (key === 'name') ? 'asc' : 'desc';
            }
            updateView();
        }

        function updateHeaderArrows() {
            const nameText = currentMode === 'personal' ? 'プレイヤー名' : 'チーム名';
            
            document.getElementById('th_name').innerHTML = nameText + (currentSortKey === 'name' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_wins').innerHTML = '1位回数' + (currentSortKey === 'wins' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_matches').innerHTML = '試合数' + (currentSortKey === 'matches' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_total_area').innerHTML = '総占領面積 <span style="font-size:0.7rem;color:#777;">[最大]</span>' + (currentSortKey === 'total_area' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_total_kills').innerHTML = '総キル数 <span style="font-size:0.7rem;color:#777;">[最大]</span>' + (currentSortKey === 'total_kills' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_kill_rate').innerHTML = 'キルレート' + (currentSortKey === 'kill_rate' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            
            document.getElementById('th_last_date').innerHTML = '最終活動' + (currentSortKey === 'last_date' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
            document.getElementById('th_first_date').innerHTML = '初登場' + (currentSortKey === 'first_date' ? (currentSortOrder === 'desc' ? ' ▼' : ' ▲') : '');
        }

        function parseToDate(dateStr) {
            if (!dateStr || dateStr === '-') return null;
            if (dateStr.includes('T')) return new Date(dateStr);
            
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                const year = parseInt('20' + parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                return new Date(year, month, day);
            }
            return null;
        }

        function updateView() {
            const query = document.getElementById('searchInput').value.trim();
            const filterType = document.getElementById('filter_type').value;
            
            let activeData = [];

            if (currentMode === 'personal') {
                if (filterType === 'all') {
                    const merged = {};
                    rawRankings.forEach(row => {
                        const type = row[0];
                        if (type === 'sp' || type === 'tp') {
                            const name = row[1];
                            if (!merged[name]) {
                                merged[name] = {
                                    name: name, team: '', isSolo: true, icon: '👤',
                                    matches: 0, total_area: 0, total_kills: 0, max_area: 0, max_kills: 0,
                                    first_date: row[10] || '-', last_date: row[9] || '-',
                                    wins: 0
                                };
                            }
                            const p = merged[name];
                            p.matches += row[4];
                            p.total_area += row[5];
                            p.total_kills += row[6];
                            p.max_area = Math.max(p.max_area, row[7]);
                            p.max_kills = Math.max(p.max_kills, row[8]);
                            p.wins += (row[11] || 0); // 👑 合体時の1位回数加算
                            
                            if (row[10] && row[10] !== '-') {
                                if (p.first_date === '-' || row[10] < p.first_date) p.first_date = row[10];
                            }
                            if (row[9] && row[9] !== '-') {
                                if (p.last_date === '-' || row[9] > p.last_date) p.last_date = row[9];
                            }
                            
                            if (type === 'tp') {
                                if (row[2]) { p.team = row[2]; p.isSolo = false; }
                                if (row[3]) { p.icon = row[3]; }
                            } else if (type === 'sp' && p.icon === '👤' && row[3]) {
                                p.icon = row[3];
                            }
                        }
                    });
                    activeData = Object.values(merged);

                } else if (filterType === 'solo') {
                    rawRankings.forEach(row => {
                        if (row[0] === 'sp') {
                            activeData.push({
                                name: row[1], team: '', isSolo: true, icon: row[3] || '👤',
                                matches: row[4], total_area: row[5], total_kills: row[6], max_area: row[7], max_kills: row[8],
                                last_date: row[9] || '-', first_date: row[10] || '-',
                                wins: row[11] || 0
                            });
                        }
                    });
                } else if (filterType === 'team') {
                    rawRankings.forEach(row => {
                        if (row[0] === 'tp') {
                            activeData.push({
                                name: row[1], team: row[2], isSolo: false, icon: row[3] || '👤',
                                matches: row[4], total_area: row[5], total_kills: row[6], max_area: row[7], max_kills: row[8],
                                last_date: row[9] || '-', first_date: row[10] || '-',
                                wins: row[11] || 0
                            });
                        }
                    });
                }

                activeData.sort((a, b) => b.total_area - a.total_area);
                activeData.forEach((p, i) => p.rank_all = i + 1);

            } else {
                rawRankings.forEach(row => {
                    if (row[0] === 't') {
                        activeData.push({
                            name: row[1], team: '', isSolo: false, icon: '', 
                            matches: row[4], total_area: row[5], total_kills: row[6], max_area: row[7], max_kills: row[8],
                            last_date: row[9] || '-', first_date: row[10] || '-',
                            wins: row[11] || 0
                        });
                    }
                });

                activeData.sort((a, b) => b.total_area - a.total_area);
                activeData.forEach((t, i) => t.rank_all = i + 1);
            }

            // 👑 ソート処理
            activeData.sort((a, b) => {
                if (currentSortKey === 'last_date' || currentSortKey === 'first_date') {
                    const dateA = parseToDate(a[currentSortKey]);
                    const dateB = parseToDate(b[currentSortKey]);
                    if (!dateA) return currentSortOrder === 'desc' ? 1 : -1;
                    if (!dateB) return currentSortOrder === 'desc' ? -1 : 1;
                    return currentSortOrder === 'desc' ? dateB.getTime() - dateA.getTime() : dateA.getTime() - dateB.getTime();
                }

                let valA, valB;
                if (currentSortKey === 'kill_rate') {
                    valA = a.matches > 0 ? (a.total_kills / a.matches) : 0;
                    valB = b.matches > 0 ? (b.total_kills / b.matches) : 0;
                } else {
                    valA = a[currentSortKey];
                    valB = b[currentSortKey];
                }

                if (typeof valA === 'string') {
                    return currentSortOrder === 'desc' ? valB.localeCompare(valA) : valA.localeCompare(valB);
                }
                return currentSortOrder === 'desc' ? valB - valA : valA - valB;
            });

            updateHeaderArrows();
            renderTable(activeData, query, filterType);
        }

        function renderTable(dataArray, searchQuery = "", filterType = "all") {
            const tbody = document.getElementById('rankingBody');
            tbody.innerHTML = '';

            let searchRank = 1;

            dataArray.forEach(p => {
                if (searchQuery) {
                    const matchName = p.name.includes(searchQuery);
                    const matchTeam = (!p.isSolo && p.team && p.team.includes(searchQuery));
                    if (!matchName && matchTeam) return; 
                }

                if (currentMode === 'personal') {
                    if (filterType === 'solo' && !p.isSolo) return;
                    if (filterType === 'team' && p.isSolo) return;
                }

                const killRate = p.matches > 0 ? (p.total_kills / p.matches).toFixed(2) : "0.00";
                const analysisUrl = `analysis.html?name=${encodeURIComponent(p.name)}&mode=${currentMode}`;
                
                const teamDisplay = (currentMode === 'personal' && !p.isSolo) ? `[${p.team}]` : "";

                const displayRankAll = `#${p.rank_all}`;
                const displaySearchRank = searchQuery ? `(#${searchRank})` : '';

                const iconContent = currentMode === 'personal' ? `
                    <div class="icon-wrapper">
                        ${p.icon}
                        <div class="tooltip">よく使うアイコン</div>
                    </div>` : '';

                const dispLast = (p.last_date && p.last_date.includes('T')) ? p.last_date.substring(2,10).replace(/-/g, '/') : p.last_date;
                const dispFirst = (p.first_date && p.first_date.includes('T')) ? p.first_date.substring(2,10).replace(/-/g, '/') : p.first_date;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-left">
                        <span class="badge-rank">${displayRankAll}</span>
                        <span class="badge-rank" style="color:var(--deep-blue);">${displaySearchRank}</span>
                    </td>
                    <td class="col-center">
                        ${iconContent}
                    </td>
                    <td class="col-left player-name-format">
                        ${teamDisplay}<a href="${analysisUrl}">${p.name}</a>
                    </td>
                    <td style="color:#ffd700; font-weight:bold;">${p.wins.toLocaleString()}回</td> <td>${p.matches.toLocaleString()}</td>
                    <td>
                        ${p.total_area.toFixed(2)}%
                        <span style="font-size:0.7rem;color:#777;">[${p.max_area.toFixed(2)}%]</span>
                    </td>
                    <td>
                        ${p.total_kills.toLocaleString()}
                        <span style="font-size:0.7rem;color:#777;">[${p.max_kills.toLocaleString()}]</span>
                    </td>
                    <td>${killRate}</td>
                    <td class="col-center" style="font-size:0.75rem; color:#888;">
                        ${dispLast} ～ ${dispFirst}
                    </td>
                `;
                tbody.appendChild(tr);
                searchRank++;
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="col-center" style="padding:20px; color:#888;">該当するデータが見つからないのです。</td></tr>`;
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab_personal').classList.remove('active');
            document.getElementById('tab_team').classList.remove('active');
            document.getElementById('tab_' + mode).classList.add('active');
            
            document.getElementById('filter_type_group').style.display = (mode === 'personal') ? 'flex' : 'none';
            
            currentSortKey = 'total_area';
            currentSortOrder = 'desc';

            updateView();
        }
    </script>
</body>
</html>
