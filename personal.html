<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人分析 - 陣取りデータバンク</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
            🎨 ランキングページ共通 超高密度サイバーダークUI
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --excel-border: #444; 
            --highlight: rgba(0, 123, 181, 0.15);
        }
        body { margin: 0; font-family: 'Yomogi', sans-serif; background-color: var(--bg-base); color: var(--text-main); font-size: 0.8rem; }
        
        header { background-color: #111; border-bottom: 1px solid var(--deep-blue); padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .site-title { font-size: 1.1rem; color: var(--deep-blue); margin: 0; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 15px; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--deep-blue); color: #fff; }

        .container { padding: 10px 15px; }
        h2 { font-size: 1rem; color: var(--deep-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 20px; margin-bottom: 10px; }
        .page-title-section { font-size: 1.2rem; color: #fff; margin-bottom: 15px; display: flex; align-items: center; }

        /* 📊 エクセル風テーブルスタイル */
        .excel-table-wrapper { overflow-x: auto; margin-bottom: 15px; }
        .excel-table { border-collapse: collapse; background-color: var(--bg-panel); width: max-content; }
        .excel-table th, .excel-table td { border: 1px solid var(--excel-border); padding: 4px 8px; text-align: right; white-space: nowrap; }
        .excel-table th { background-color: #111; color: #ccc; text-align: center; }
        .excel-table tr:hover { background-color: var(--highlight); }
        .col-left { text-align: left !important; }

        /* サブテーブル用グリッド */
        .sub-tables-grid { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }

        /* チーム選択チップス */
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .chip { background: #111; padding: 3px 10px; border-radius: 3px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--excel-border); transition: 0.2s; color: #ccc; }
        .chip:hover { background: #333; }
        .chip.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }

        /* 📈 グラフエリア */
        .chart-container { background-color: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; }
        .graph-controls { background: #111; padding: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .controls-group { border-right: 1px solid #444; padding-right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
        .controls-group:last-child { border-right: none; }
        
        input[type="datetime-local"], select { background: #000; color: #fff; border: 1px solid #555; padding: 3px; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn { background: #333; color: #fff; border: 1px solid #555; padding: 3px 8px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn:hover { background: #444; }

        /* グラフ要素のチェックボックス群 */
        .element-toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }
        .element-toggles label { background: #1a1c20; border: 1px solid #444; padding: 2px 6px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
        .element-toggles label:hover { background: #2a2c30; }
        .element-toggles label:has(input:disabled) { color: #555 !important; cursor: not-allowed; opacity: 0.5; }

        /* 🔗 リンクスタイル（チーム・個人両対応） */
        .anal-link { color: var(--text-main); text-decoration: none; cursor: pointer; }
        .anal-link:hover { text-underline-position: under; text-decoration: underline; color: #fff; }

        /* ==========================================
            💬 プレイヤー図鑑エリアのデザイン
        ========================================== */
        .review-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; align-items: flex-start; }
        
        /* 🟢 掲示板風スタイル */
        .review-bbs { background-color: #2a2d35; border-left: 4px solid #007bb5; padding: 10px; border-radius: 4px; font-size: 0.85rem; line-height: 1.5; min-width: 320px; max-width: 400px; flex-shrink: 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .bbs-meta { color: #888; font-size: 0.75rem; margin-bottom: 5px; border-bottom: 1px dashed #444; padding-bottom: 3px; }
        .bbs-author { color: #22dd22; font-weight: bold; } /* 名無しを緑に */
        .bbs-content { white-space: pre-wrap; color: #e0e0e0; }
        
        /* 🐦 Twitter風・連投スタイル */
        .review-twitter { background-color: #15202b; border: 1px solid #38444d; padding: 12px; border-radius: 8px; min-width: 320px; max-width: 400px; flex-shrink: 0; }
        .tweet-block { margin-bottom: -10px; } /* 公式ウィジェットの余白を詰める */
        
        /* 🖼️ 画像スタイル */
        .review-image { background-color: #222; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #333; min-width: 300px; max-width: 400px; flex-shrink: 0; }
        .review-image img { max-width: 100%; max-height: 350px; border-radius: 4px; object-fit: contain; }
        .image-caption { font-size: 0.75rem; color: #aaa; margin-top: 5px; }

        .ref-link { display: inline-block; margin-top: 8px; font-size: 0.75rem; color: #4fa8ff; text-decoration: none; }
        .ref-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="container">
        <div class="page-title-section" id="player-name-title">👤 個人分析: 読み込み中...</div>

        <h2>📊 基本統計・計算値</h2>
        <div class="excel-table-wrapper">
            <table class="excel-table" id="main-summary-table">
                <thead>
                    <tr>
                        <th colspan="2">区分</th>
                        <th>試合数</th><th>1位数</th><th>累計面積</th><th>最大面積</th><th>総キル数</th><th>最大キル</th>
                        <th>毎試合キル数</th><th>毎分キル数</th><th>毎試合面積</th><th>毎分面積</th>
                        <th>平均個人順位</th><th>平均チーム順位</th><th>平均面積</th><th>平均キル</th>
                    </tr>
                </thead>
                <tbody id="main-summary-body">
                    </tbody>
            </table>
        </div>

        <h2>🏴 これまでに所属したチーム (クリックで下の表とグラフを絞り込み)</h2>
        <div class="chip-container" id="team-chips">
            </div>

        <div class="sub-tables-grid">
            <div>
                <h2>🏅 順位別獲得数 (選択チーム反映)</h2>
                <table class="excel-table">
                    <thead><tr><th>順位別獲得数</th><th>回数(回)</th><th>割合(%)</th></tr></thead>
                    <tbody id="sub-rank-body"></tbody>
                </table>
            </div>
            <div>
                <h2>💬 使用アイコン (選択チーム反映)</h2>
                <table class="excel-table">
                    <thead><tr><th>アイコン</th><th>回数</th></tr></thead>
                    <tbody id="sub-icon-body"></tbody>
                </table>
            </div>
        </div>

        <h2>📈 戦績の推移 (高度なプロット)</h2>
        <div class="chart-container">
            <div class="graph-controls">
                <div class="controls-group">
                    <label>期間:</label>
                    <input type="datetime-local" id="date-start"> ～ <input type="datetime-local" id="date-end">
                </div>
                <div class="controls-group">
                    <button class="btn" onclick="setPresetDate('1h')">直近1時間</button>
                    <button class="btn" onclick="setPresetDate('1d')">直近1日</button>
                    <button class="btn" onclick="setPresetDate('1w')">直近1週間</button>
                    <button class="btn" onclick="setPresetDate('1m')">直近1か月</button>
                    <button class="btn" onclick="setPresetDate('all')">全期間</button>
                </div>
                <div class="controls-group">
                    <label>スケール:</label>
                    <select id="graph-scale" onchange="checkScaleConstraints(); updateChart();">
                        <option value="all">全試合(点打)</option>
                        <option value="hour">1時間毎</option>
                        <option value="day">1日毎</option>
                        <option value="week">1週間毎</option>
                        <option value="month">1か月毎</option>
                    </select>
                </div>
                <div class="controls-group">
                    <label><input type="checkbox" id="skip-empty" checked onchange="updateChart()"> 参加していない日時を飛ばす</label>
                </div>
            </div>

            <div class="element-toggles" id="plot-elements">
                </div>

            <canvas id="historyChart" style="max-height: 450px; margin-top: 10px;"></canvas>
        </div>

        <h2>💬 プレイヤー図鑑</h2>
        <div class="review-scroll" id="reviews-box">
            <div style="color: #888; padding: 10px;">評価データを読み込み中...</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const playerName = params.get('name') || "(≡3≡)";
        const GAME_MINUTES = 3.0; // 個人戦は毎分計算用の仮定時間

        let rawHistory = [];
        let selectedTeams = [];
        let myChart = null;

        // グラフで選べる要素の定義
        const plotOptions = [
            { id: 'matches', label: '参加回数', color: '#ffffff', type: 'sum', requiresScale: true },
            { id: 'wins', label: '1位数', color: '#ffea00', type: 'sum' },
            { id: 'area_sum', label: '累計面積(期間合算)', color: '#4fa8ff', type: 'sum' },
            { id: 'area_acc', label: '累計面積(全期間加算)', color: '#0055ff', type: 'acc' },
            { id: 'area_max', label: '最大面積', color: '#00ffcc', type: 'max' },
            { id: 'kill_sum', label: '総キル数(期間合算)', color: '#ff4f79', type: 'sum' },
            { id: 'kill_acc', label: '総キル数(全期間加算)', color: '#cc0000', type: 'acc' },
            { id: 'kill_max', label: '最大キル', color: '#ffaa00', type: 'max' },
            { id: 'kill_avg', label: '毎試合キル数(平均)', color: '#ff88aa', type: 'avg' },
            { id: 'kill_min', label: '毎分キル数', color: '#ffbbcc', type: 'avg_min' },
            { id: 'area_avg', label: '毎試合面積(平均)', color: '#88ccff', type: 'avg' },
            { id: 'area_min', label: '毎分面積', color: '#bbeeff', type: 'avg_min' },
            { id: 'rank_avg', label: '平均個人順位(逆軸)', color: '#bbff00', type: 'avg_rev' }
        ];

        function getSafeFilename(name) { return name.replace(/[\\/:*?"<>|]/g, '_'); }

        async function loadPlayerData() {
            try {
                const safeName = getSafeFilename(playerName);
                const response = await fetch(`analysis_data/personal_analysis/${safeName}.json`);
                if (!response.ok) throw new Error("ファイルが見つかりません");
                const data = await response.json();
                
                document.getElementById('player-name-title').innerText = `👤 個人分析: ${data.name}`;
                rawHistory = (data.h || []).sort((a,b) => new Date(a.at) - new Date(b.at)); 

                buildMainTable(rawHistory);
                buildTeamChips(rawHistory);
                updateSubTables();
                initGraphControls();
                updateChart();
            } catch (err) {
                document.getElementById('player-name-title').innerText = `❌ データが見つかりませんでした: ${playerName}`;
                console.error(err);
            }

            // 🌟 追加：プレイヤー図鑑の読み込みを実行
            loadCommunityReviews(playerName);
        }

        // ==========================================
        // 🌟 プレイヤー図鑑の読み込み・描画
        // ==========================================
        async function loadCommunityReviews(targetName) {
            const box = document.getElementById('reviews-box');
            try {
                // 同じ階層にあるファイルを直接指定
                const response = await fetch('analysis_data/community_reviews.json');
                if (!response.ok) throw new Error("評価用JSONが見つかりません");
                
                const data = await response.json();
                let reviews = data.personal_reviews[targetName];

                if (!reviews || reviews.length === 0) {
                    box.innerHTML = `<div style="color: #888; padding: 10px;">このプレイヤーのプレイヤー図鑑はまだありません。</div>`;
                    return;
                }

                // 💡 配列をランダムにシャッフル（表示のたびに順番を変える）
                for (let i = reviews.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [reviews[i], reviews[j]] = [reviews[j], reviews[i]];
                }

                let htmlContent = '';

                reviews.forEach(r => {
                    if (r.type === 'bbs') {
                        htmlContent += `
                            <div class="review-bbs">
                                <div class="bbs-meta">
                                    <span>${r.bbs_header.res_no}</span> : 
                                    <span class="bbs-author">${r.bbs_header.author}</span> 
                                    <span>${r.bbs_header.posted_at}</span> ID:${r.bbs_header.user_id}
                                </div>
                                <div class="bbs-content">${r.content}</div>
                                ${r.ref_url ? `<a href="${r.ref_url}" target="_blank" class="ref-link">🔗 引用元スレッド</a>` : ''}
                            </div>
                        `;
                    } 
                    else if (r.type === 'twitter') {
                        let tweetHtml = `<div class="review-twitter">`;
                        r.tweets.forEach(t => {
                            // Twitter公式のblockquoteを使用して自動カード化させる
                            tweetHtml += `
                                <div class="tweet-block">
                                    <p style="color: #4fa8ff; font-size: 0.75rem; margin: 0 0 4px 0;">💬 ツイート P.${t.page}</p>
                                    <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true">
                                        <a href="https://twitter.com/x/status/${t.tweet_id}"></a>
                                    </blockquote>
                                </div>
                            `;
                        });
                        if (r.ref_url) {
                            tweetHtml += `<a href="${r.ref_url}" target="_blank" class="ref-link">🔗 引用元へ</a>`;
                        }
                        tweetHtml += `</div>`;
                        htmlContent += tweetHtml;
                    } 
                    else if (r.type === 'image') {
                        htmlContent += `
                            <div class="review-image">
                                <img src="${r.image_url}" alt="評価画像" loading="lazy">
                                ${r.caption ? `<div class="image-caption">${r.caption}</div>` : ''}
                                ${r.ref_url ? `<br><a href="${r.ref_url}" target="_blank" class="ref-link">🔗 画像の引用元</a>` : ''}
                            </div>
                        `;
                    }
                });

                box.innerHTML = htmlContent;

                // 💡 動的に追加したTwitterのblockquoteをカードに変換するため公式スクリプトをロード
                if (htmlContent.includes('twitter-tweet')) {
                    const script = document.createElement('script');
                    script.src = "https://platform.twitter.com/widgets.js";
                    script.charset = "utf-8";
                    script.async = true;
                    document.body.appendChild(script);
                }

            } catch (err) {
                box.innerHTML = `<div style="color: #ff4444; padding: 10px;">評価データの読み込みに失敗しました。</div>`;
                console.error(err);
            }
        }

        // ==========================================
        // 1. エクセル風縦書き結合メインテーブルの構築
        // ==========================================
        function calcRowData(records) {
            const count = records.length;
            if(count === 0) return Array(14).fill('-');
            let w=0, aSum=0, aMax=0, kSum=0, kMax=0, rSum=0;
            records.forEach(r => {
                const sc = parseFloat(r.sc||0); const k = parseInt(r.k||0); const rk = parseInt(r.rk||0);
                if(rk === 1) w++;
                aSum += sc; if(sc > aMax) aMax = sc;
                kSum += k; if(k > kMax) kMax = k;
                rSum += rk;
            });
            const kAvg = kSum / count; const kMin = kAvg / GAME_MINUTES;
            const aAvg = aSum / count; const aMin = aAvg / GAME_MINUTES;
            const rAvg = rSum / count;
            
            return [
                count, w, aSum.toFixed(2), aMax.toFixed(2), kSum, kMax,
                kAvg.toFixed(2), kMin.toFixed(2), aAvg.toFixed(2), aMin.toFixed(2),
                rAvg.toFixed(1), "-", aAvg.toFixed(2), kAvg.toFixed(2)
            ];
        }

        function buildMainTable(history) {
            const solo = history.filter(r => r.md === 'SOLO');
            const teamAll = history.filter(r => r.md === 'TEAM');
            const teamNone = teamAll.filter(r => !r.tm);
            
            const tMap = {};
            teamAll.filter(r => r.tm).forEach(r => {
                if(!tMap[r.tm]) tMap[r.tm] = [];
                tMap[r.tm].push(r);
            });
            const sortedTeams = Object.keys(tMap).sort((a,b) => tMap[b].length - tMap[a].length);
            const top10 = sortedTeams.slice(0, 10);
            const others = sortedTeams.slice(10).flatMap(t => tMap[t]);

            const tbody = document.getElementById('main-summary-body');
            tbody.innerHTML = "";

            // ① ソロ戦行
            const soloVals = calcRowData(solo);
            tbody.innerHTML += `<tr><th class="col-left" style="background:#111; text-align:center;" colspan="2">ソロ戦</th><td>${soloVals.join('</td><td>')}</td></tr>`;

            const totalTeamRows = 1 + top10.length + 1 + 1;

            // ② チーム戦無所属
            const noneVals = calcRowData(teamNone);
            let html = `<tr>
                <td rowspan="${totalTeamRows}" style="text-align:center; font-weight:bold; background:#111; writing-mode: vertical-rl; text-orientation: upright; padding: 10px 6px; letter-spacing: 4px; border-right: 2px solid var(--deep-blue);">チーム戦</td>
                <th class="col-left">チーム戦無所属</th>
                <td>${noneVals.join('</td><td>')}</td>
            </tr>`;

            // ③ トップ10チーム（💡 チーム名にチーム分析ページへのリンクを付与！）
            top10.forEach((t) => {
                const vals = calcRowData(tMap[t]);
                html += `<tr><th class="col-left"><a class="anal-link" href="team.html?name=${encodeURIComponent(t)}">${t}</a></th><td>${vals.join('</td><td>')}</td></tr>`;
            });

            // ④ その他
            const othersVals = calcRowData(others);
            html += `<tr><th class="col-left">その他</th><td>${othersVals.join('</td><td>')}</td></tr>`;

            // ⑤ チーム戦合計
            const teamAllVals = calcRowData(teamAll);
            html += `<tr><th class="col-left">チーム戦合計</th><td>${teamAllVals.join('</td><td>')}</td></tr>`;

            tbody.innerHTML += html;

            // ⑥ 総計行
            const allVals = calcRowData(history);
            tbody.innerHTML += `<tr><th class="col-left" style="background:#111; text-align:center;" colspan="2">総計</th><td>${allVals.join('</td><td>')}</td></tr>`;
        }

        // ==========================================
        // 2. 所属チームチップス (指定順ソート) とサブテーブル
        // ==========================================
        function buildTeamChips(history) {
            const tMap = {};
            history.forEach(r => {
                let key = "無所属(SOLO)";
                if(r.md === 'TEAM') key = r.tm ? r.tm : "無所属(TEAM)";
                tMap[key] = (tMap[key] || 0) + 1;
            });
            const allTeamCount = history.filter(r => r.md === 'TEAM').length;

            const container = document.getElementById('team-chips');
            container.innerHTML = "";

            const createChip = (id, label, count) => {
                if(count === 0 && id !== "チーム戦合計") return;
                const chip = document.createElement('div');
                chip.className = 'chip'; chip.innerText = `${label} (${count})`;
                chip.onclick = () => {
                    chip.classList.toggle('active');
                    if(chip.classList.contains('active')) selectedTeams.push(id);
                    else selectedTeams = selectedTeams.filter(t => t !== id);
                    updateSubTables(); updateChart();
                };
                container.appendChild(chip);
            };

            createChip("無所属(SOLO)", "無所属(SOLO)", tMap["無所属(SOLO)"]||0);
            createChip("TEAM_ALL", "チーム戦合計", allTeamCount);

            const otherTeams = Object.keys(tMap).filter(k => k !== "無所属(SOLO)");
            otherTeams.sort((a, b) => tMap[b] - tMap[a]);
            otherTeams.forEach(k => { createChip(k, k, tMap[k]); });
        }

        function getFilteredHistory() {
            if(selectedTeams.length === 0) return rawHistory;
            return rawHistory.filter(r => {
                let key = "無所属(SOLO)";
                if(r.md === 'TEAM') key = r.tm ? r.tm : "無所属(TEAM)";
                if(selectedTeams.includes("TEAM_ALL") && r.md === 'TEAM') return true;
                return selectedTeams.includes(key);
            });
        }

        function updateSubTables() {
            const h = getFilteredHistory();
            const total = h.length;

            const rCounts = Array(11).fill(0);
            h.forEach(r => { const rk = parseInt(r.rk); if(rk>=1 && rk<=10) rCounts[rk]++; });
            let rHtml = "";
            for(let i=1; i<=10; i++) {
                const pct = total > 0 ? ((rCounts[i]/total)*100).toFixed(1) : "0.0";
                rHtml += `<tr><td class="col-left">${i}位</td><td>${rCounts[i]}</td><td>${pct}%</td></tr>`;
            }
            document.getElementById('sub-rank-body').innerHTML = rHtml;

            const eMap = {};
            h.forEach(r => { if(r.em) eMap[r.em] = (eMap[r.em] || 0) + 1; });
            const sortedE = Object.keys(eMap).sort((a,b) => eMap[b] - eMap[a]);
            let eHtml = "";
            sortedE.forEach(e => { eHtml += `<tr><td class="col-left" style="font-size:1.2rem;">${e}</td><td>${eMap[e]}</td></tr>`; });
            if(sortedE.length === 0) eHtml = `<tr><td colspan="2">データなし</td></tr>`;
            document.getElementById('sub-icon-body').innerHTML = eHtml;
        }

        // ==========================================
        // 3. 高度なグラフ描画システム
        // ==========================================
        function initGraphControls() {
            const tg = document.getElementById('plot-elements');
            tg.innerHTML = "";
            plotOptions.forEach((opt) => {
                const checked = (opt.id === 'area_acc' || opt.id === 'kill_acc') ? 'checked' : '';
                tg.innerHTML += `<label><input type="checkbox" class="plot-chk" value="${opt.id}" ${checked} onchange="checkScaleConstraints(); updateChart();"> <span style="color:${opt.color};">■</span> ${opt.label}</label>`;
            });

            if(rawHistory.length > 0) {
                const sd = new Date(rawHistory[0].at);
                const ed = new Date(rawHistory[rawHistory.length-1].at);
                const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
                document.getElementById('date-start').value = fmt(sd);
                document.getElementById('date-end').value = fmt(ed);
            }

            document.getElementById('date-start').addEventListener('change', updateChart);
            document.getElementById('date-end').addEventListener('change', updateChart);

            document.getElementById('graph-scale').value = 'all';
            document.getElementById('skip-empty').checked = true;
            checkScaleConstraints();
        }

        function setPresetDate(type) {
            if(rawHistory.length === 0) return;
            const ed = new Date(rawHistory[rawHistory.length-1].at);
            let sd = new Date(ed);
            if(type === '1h') sd.setHours(sd.getHours() - 1);
            if(type === '1d') sd.setDate(sd.getDate() - 1);
            if(type === '1w') sd.setDate(sd.getDate() - 7);
            if(type === '1m') sd.setMonth(sd.getMonth() - 1);
            if(type === 'all') sd = new Date(rawHistory[0].at);

            const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
            document.getElementById('date-start').value = fmt(sd);
            document.getElementById('date-end').value = fmt(ed);
            updateChart();
        }

        function checkScaleConstraints() {
            const scale = document.getElementById('graph-scale').value;
            const skipChk = document.getElementById('skip-empty');
            const matchChk = document.querySelector('.plot-chk[value="matches"]');

            skipChk.disabled = false;
            if(scale === 'all') {
                matchChk.checked = false;
                matchChk.disabled = true;
            } else {
                matchChk.disabled = false;
                if(matchChk.checked) {
                    skipChk.checked = false; 
                    skipChk.disabled = true;
                }
            }
        }

        function truncDate(d, scale) {
            const t = new Date(d);
            t.setMinutes(0,0,0);
            if(scale === 'day' || scale === 'week' || scale === 'month') t.setHours(0);
            if(scale === 'week') { const diff = t.getDate() - t.getDay(); t.setDate(diff); }
            if(scale === 'month') t.setDate(1);
            return t;
        }
        function addTime(d, scale) {
            const t = new Date(d);
            if(scale === 'hour') t.setHours(t.getHours()+1);
            if(scale === 'day') t.setDate(t.getDate()+1);
            if(scale === 'week') t.setDate(t.getDate()+7);
            if(scale === 'month') t.setMonth(t.getMonth()+1);
            return t;
        }
        function formatLabel(d, scale) {
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function updateChart() {
            let h = getFilteredHistory();
            const sdStr = document.getElementById('date-start').value;
            const edStr = document.getElementById('date-end').value;
            if(sdStr && edStr) {
                const sd = new Date(sdStr); const ed = new Date(edStr);
                h = h.filter(r => { const d = new Date(r.at); return d >= sd && d <= ed; });
            }

            const scale = document.getElementById('graph-scale').value;
            const skipEmpty = document.getElementById('skip-empty').checked;
            
            const activeOpts = [];
            document.querySelectorAll('.plot-chk:checked').forEach(chk => {
                const opt = plotOptions.find(o => o.id === chk.value);
                if(opt) activeOpts.push(opt);
            });

            let labels = [];
            let datasetsData = {};
            activeOpts.forEach(opt => datasetsData[opt.id] = []);

            if(h.length === 0) {
                renderChartJs(labels, activeOpts, datasetsData, false); return;
            }

            let isTimeScale = (scale === 'all' && !skipEmpty);

            if (scale === 'all') {
                if (skipEmpty) {
                    let accArea = 0, accKill = 0;
                    h.forEach(r => {
                        labels.push(formatLabel(new Date(r.at), 'all'));
                        const sc = parseFloat(r.sc||0); const k = parseInt(r.k||0); const rk = parseInt(r.rk||0);
                        accArea += sc; accKill += k;
                        activeOpts.forEach(opt => {
                            let val = 0;
                            if(opt.id === 'area_sum' || opt.id === 'area_max' || opt.id === 'area_avg') val = sc;
                            if(opt.id === 'area_acc') val = accArea;
                            if(opt.id === 'kill_sum' || opt.id === 'kill_max' || opt.id === 'kill_avg') val = k;
                            if(opt.id === 'kill_acc') val = accKill;
                            if(opt.id === 'kill_min') val = k / GAME_MINUTES;
                            if(opt.id === 'area_min') val = sc / GAME_MINUTES;
                            if(opt.id === 'rank_avg') val = rk;
                            if(opt.id === 'wins') val = rk === 1 ? 1 : 0;
                            datasetsData[opt.id].push(val);
                        });
                    });
                } else {
                    let accArea = 0, accKill = 0;
                    for (let i = 0; i < h.length; i++) {
                        const r = h[i];
                        const d = new Date(r.at);
                        const sc = parseFloat(r.sc||0); const k = parseInt(r.k||0); const rk = parseInt(r.rk||0);
                        accArea += sc; accKill += k;

                        activeOpts.forEach(opt => {
                            let val = 0;
                            if(opt.id === 'area_sum' || opt.id === 'area_max' || opt.id === 'area_avg') val = sc;
                            if(opt.id === 'area_acc') val = accArea;
                            if(opt.id === 'kill_sum' || opt.id === 'kill_max' || opt.id === 'kill_avg') val = k;
                            if(opt.id === 'kill_acc') val = accKill;
                            if(opt.id === 'kill_min') val = k / GAME_MINUTES;
                            if(opt.id === 'area_min') val = sc / GAME_MINUTES;
                            if(opt.id === 'rank_avg') val = rk;
                            if(opt.id === 'wins') val = rk === 1 ? 1 : 0;
                            datasetsData[opt.id].push({ x: d, y: val });
                        });

                        if (i < h.length - 1) {
                            const nextD = new Date(h[i+1].at);
                            if (nextD - d > 20 * 60 * 1000) {
                                const dAfter = new Date(d.getTime() + 3 * 60 * 1000);   
                                const dBefore = new Date(nextD.getTime() - 1 * 60 * 1000); 

                                activeOpts.forEach(opt => {
                                    let valAfter = 0, valBefore = 0;
                                    if (opt.id === 'area_acc') { valAfter = accArea; valBefore = accArea; }
                                    else if (opt.id === 'kill_acc') { valAfter = accKill; valBefore = accKill; }
                                    else if (opt.id === 'rank_avg') { valAfter = null; valBefore = null; } 
                                    else { valAfter = 0; valBefore = 0; } 

                                    datasetsData[opt.id].push({ x: dAfter, y: valAfter });
                                    datasetsData[opt.id].push({ x: dBefore, y: valBefore });
                                });
                            }
                        }
                    }
                }
            } else {
                const buckets = {};
                h.forEach(r => {
                    const key = truncDate(new Date(r.at), scale).getTime();
                    if(!buckets[key]) buckets[key] = [];
                    buckets[key].push(r);
                });

                let curr = truncDate(new Date(h[0].at), scale);
                const end = truncDate(new Date(h[h.length-1].at), scale);
                let accArea = 0, accKill = 0;

                while(curr <= end) {
                    const key = curr.getTime();
                    const records = buckets[key] || [];
                    
                    if(records.length > 0 || !skipEmpty) {
                        labels.push(formatLabel(curr, scale));
                        
                        let scSum=0, scMax=0, kSum=0, kMax=0, rSum=0, wCount=0;
                        records.forEach(r => {
                            const sc = parseFloat(r.sc||0); const k = parseInt(r.k||0); const rk = parseInt(r.rk||0);
                            scSum+=sc; kSum+=k; rSum+=rk;
                            if(sc > scMax) scMax=sc; if(k > kMax) kMax=k;
                            if(rk === 1) wCount++;
                        });
                        accArea += scSum; accKill += kSum;
                        const c = records.length;

                        activeOpts.forEach(opt => {
                            let val = 0;
                            if(c > 0) {
                                if(opt.id === 'matches') val = c;
                                if(opt.id === 'wins') val = wCount;
                                if(opt.id === 'area_sum') val = scSum;
                                if(opt.id === 'area_acc') val = accArea;
                                if(opt.id === 'area_max') val = scMax;
                                if(opt.id === 'kill_sum') val = kSum;
                                if(opt.id === 'kill_acc') val = accKill;
                                if(opt.id === 'kill_max') val = kMax;
                                if(opt.id === 'kill_avg') val = kSum/c;
                                if(opt.id === 'kill_min') val = (kSum/c)/GAME_MINUTES;
                                if(opt.id === 'area_avg') val = scSum/c;
                                if(opt.id === 'area_min') val = (scSum/c)/GAME_MINUTES;
                                if(opt.id === 'rank_avg') val = rSum/c;
                            } else {
                                if(opt.id === 'area_acc') val = accArea;
                                else if(opt.id === 'kill_acc') val = accKill;
                                else if(opt.id === 'rank_avg') val = null; 
                                else val = 0; 
                            }
                            datasetsData[opt.id].push(val);
                        });
                    }
                    curr = addTime(curr, scale);
                }
            }

            renderChartJs(labels, activeOpts, datasetsData, isTimeScale);
        }

        function renderChartJs(labels, activeOpts, datasetsData, isTimeScale) {
            if(myChart) myChart.destroy();
            
            const datasets = [];
            const scalesDef = { 
                x: { 
                    type: isTimeScale ? 'time' : 'category',
                    grid: { color: '#333' },
                    ticks: { color: '#ccc' }
                } 
            };

            activeOpts.forEach((opt, i) => {
                const axisId = `yAxis_${i}`;
                datasets.push({
                    label: opt.label,
                    data: datasetsData[opt.id],
                    borderColor: opt.color,
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0, 
                    pointHitRadius: 10,
                    tension: 0.1,
                    spanGaps: true, 
                    yAxisID: axisId
                });

                scalesDef[axisId] = {
                    type: 'linear',
                    display: true,
                    position: i % 2 === 0 ? 'left' : 'right',
                    grid: { drawOnChartArea: i === 0, color: '#333' },
                    ticks: { color: opt.color }
                };
                if(opt.type === 'avg_rev') {
                    scalesDef[axisId].reverse = true;
                    scalesDef[axisId].min = 1; scalesDef[axisId].max = 10;
                }
            });

            const ctx = document.getElementById('historyChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: isTimeScale ? { datasets } : { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false, 
                    interaction: { mode: 'index', intersect: false },
                    scales: scalesDef,
                    plugins: { 
                        legend: { labels: { color: '#ccc' } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        let val = context.parsed.y;
                                        if (typeof val === 'number') {
                                            val = val % 1 === 0 ? val : val.toFixed(2);
                                        }
                                        if (label.includes('面積')) val += '％';
                                        else if (label.includes('キル')) val += 'キル';
                                        else if (label.includes('順位')) val += '位';
                                        else if (label.includes('回数') || label.includes('参加')) val += '回';
                                        else if (label.includes('数')) val += '回';
                                        return label + val;
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }

        window.onload = loadPlayerData;
    </script>

      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
