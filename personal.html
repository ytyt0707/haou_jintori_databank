<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人分析 - 陣取りデータバンク</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
            🎨 ランキングページ共通 超高密度サイバーダークUI
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --excel-border: #555; /* エクセル風の罫線色 */
            --highlight: rgba(0, 123, 181, 0.15);
        }
        body {
            margin: 0;
            font-family: 'Yomogi', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.85rem;
        }
        
        /* 共通ヘッダー (変更なし) */
        header {
            background-color: #111;
            border-bottom: 1px solid var(--deep-blue);
            padding: 6px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .site-title { font-size: 1.1rem; color: var(--deep-blue); margin: 0; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 15px; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--deep-blue); color: #fff; }

        /* コンテンツ領域 */
        .container {
            padding: 15px 20px;
        }
        h2 {
            font-size: 1rem;
            color: var(--deep-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .page-title-section {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        /* 📊 エクセル風テーブルスタイル */
        .excel-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-panel);
            margin-bottom: 10px;
        }
        .excel-table th, .excel-table td {
            border: 1px solid var(--excel-border);
            padding: 4px 10px;
            text-align: right;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .excel-table th {
            background-color: #111;
            color: #ccc;
            text-align: center;
            font-weight: normal;
        }
        .excel-table tr:nth-child(even) {
            background-color: #1a1a1a;
        }
        .excel-table tr:hover {
            background-color: var(--highlight);
        }

        /* チーム選択チップス */
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
        .chip {
            background: #111; padding: 3px 10px; border-radius: 3px;
            font-size: 0.8rem; cursor: pointer; border: 1px solid var(--excel-border);
            transition: 0.2s; color: #ccc;
        }
        .chip:hover { background: #333; }
        .chip.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }

        /* 📈 グラフ・人物評エリア */
        .chart-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
        }
        .controls { margin-bottom: 10px; font-size: 0.8rem; }
        .review-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; }
        .review-card {
            min-width: 250px; background: #111; padding: 10px;
            border: 1px solid var(--excel-border); border-left: 4px solid var(--deep-blue);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html">複数データプロット</a>
        </div>
    </header>

    <div class="container">
        <div class="page-title-section" id="player-name-title">
            👤 個人分析: 読み込み中...
        </div>

        <h2>📊 基本統計・計算値</h2>
        <table class="excel-table">
            <thead>
                <tr>
                    <th>累計試合数</th>
                    <th>平均スコア</th>
                    <th>平均キル数</th>
                    <th>平均順位</th>
                    <th>上位(3位以内)率</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="stat-total-games" style="text-align: center;">-</td>
                    <td id="stat-avg-score" style="text-align: center;">-</td>
                    <td id="stat-avg-kills" style="text-align: center;">-</td>
                    <td id="stat-avg-rank" style="text-align: center;">-</td>
                    <td id="stat-top3-rate" style="text-align: center;">-</td>
                </tr>
            </tbody>
        </table>

        <h2>🏅 順位別獲得回数</h2>
        <div style="overflow-x: auto;">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>1位</th><th>2位</th><th>3位</th><th>4位</th><th>5位</th>
                        <th>6位</th><th>7位</th><th>8位</th><th>9位</th><th>10位</th>
                    </tr>
                </thead>
                <tbody id="rank-distribution-row">
                    </tbody>
            </table>
        </div>

        <h2>🏴 これまでに所属したチーム (クリックでグラフ絞り込み)</h2>
        <div class="chip-container" id="team-chips">
            </div>

        <h2>📈 戦績の推移 (複数選択プロット)</h2>
        <div class="chart-container">
            <div class="controls">
                <label><input type="checkbox" class="metric-chk" value="sc" checked> スコア</label>
                <label style="margin-left:15px;"><input type="checkbox" class="metric-chk" value="k"> キル数</label>
                <label style="margin-left:15px;"><input type="checkbox" class="metric-chk" value="rk"> 順位(逆軸)</label>
            </div>
            <canvas id="historyChart" style="max-height: 350px;"></canvas>
        </div>

        <h2>💬 コミュニティからの人物評</h2>
        <div class="review-scroll" id="reviews-box">
            </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const playerName = params.get('name') || "(≡3≡)";

        let rawHistory = [];
        let selectedTeams = [];
        let myChart = null;

        function getSafeFilename(name) {
            return name.replace(/[\\/:*?"<>|]/g, '_');
        }

        async function loadPlayerData() {
            try {
                const safeName = getSafeFilename(playerName);
                const response = await fetch(`analysis_data/personal_analysis/${safeName}.json`);
                if (!response.ok) throw new Error("ファイルが見つからないのです");
                const data = await response.json();
                
                document.getElementById('player-name-title').innerText = `👤 個人分析: ${data.name}`;
                rawHistory = data.h || [];

                calculateStats(rawHistory);
                renderRankDistribution(rawHistory);
                renderTeamChips(rawHistory);
                updateChart();
                renderReviews();

            } catch (err) {
                document.getElementById('player-name-title').innerText = `❌ データが見つかりませんでした: ${playerName}`;
                console.error(err);
            }
        }

        function calculateStats(history) {
            const total = history.length;
            if(total === 0) return;

            let scoreSum = 0, killSum = 0, rankSum = 0, top3Count = 0;
            history.forEach(item => {
                scoreSum += parseFloat(item.sc || 0);
                killSum += parseInt(item.k || 0);
                rankSum += parseInt(item.rk || 0);
                if(parseInt(item.rk) <= 3) top3Count++;
            });

            document.getElementById('stat-total-games').innerText = `${total} 試合`;
            document.getElementById('stat-avg-score').innerText = (scoreSum / total).toFixed(2);
            document.getElementById('stat-avg-kills').innerText = (killSum / total).toFixed(1);
            document.getElementById('stat-avg-rank').innerText = `${(rankSum / total).toFixed(1)} 位`;
            document.getElementById('stat-top3-rate').innerText = `${((top3Count / total) * 100).toFixed(1)}%`;
        }

        function renderRankDistribution(history) {
            const counts = Array(11).fill(0);
            history.forEach(item => {
                const r = parseInt(item.rk);
                if(r >= 1 && r <= 10) counts[r]++;
            });

            const tr = document.getElementById('rank-distribution-row');
            tr.innerHTML = "<tr>";
            for(let i=1; i<=10; i++) {
                tr.innerHTML += `<td style="text-align: center;">${counts[i]}</td>`;
            }
            tr.innerHTML += "</tr>";
        }

        function renderTeamChips(history) {
            const teamMap = {};
            history.forEach(item => {
                const t = item.tm || "無所属(SOLO)";
                teamMap[t] = (teamMap[t] || 0) + 1;
            });

            const container = document.getElementById('team-chips');
            container.innerHTML = "";
            Object.keys(teamMap).forEach(team => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = `${team} (${teamMap[team]})`;
                chip.addEventListener('click', () => {
                    chip.classList.toggle('active');
                    if(chip.classList.contains('active')) {
                        selectedTeams.push(team);
                    } else {
                        selectedTeams = selectedTeams.filter(t => t !== team);
                    }
                    updateChart();
                });
                container.appendChild(chip);
            });
        }

        function updateChart() {
            let filtered = rawHistory;
            if(selectedTeams.length > 0) {
                filtered = rawHistory.filter(item => {
                    const t = item.tm || "無所属(SOLO)";
                    return selectedTeams.includes(t);
                });
            }

            filtered.sort((a,b) => a.id - b.id);
            const labels = filtered.map(item => `R-${item.id}`);
            const datasets = [];

            const chks = document.querySelectorAll('.metric-chk:checked');
            chks.forEach(chk => {
                const val = chk.value;
                if(val === 'sc') {
                    datasets.push({ label: 'スコア', data: filtered.map(item => parseFloat(item.sc)), borderColor: '#007bb5', backgroundColor: 'transparent', yAxisID: 'y' });
                } else if(val === 'k') {
                    datasets.push({ label: 'キル数', data: filtered.map(item => item.k), borderColor: '#ff4f79', backgroundColor: 'transparent', yAxisID: 'y1' });
                } else if(val === 'rk') {
                    datasets.push({ label: '順位', data: filtered.map(item => item.rk), borderColor: '#ffbd4f', backgroundColor: 'transparent', yAxisID: 'yRank' });
                }
            });

            if(myChart) myChart.destroy();

            const ctx = document.getElementById('historyChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', grid: { color: '#333' } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false } },
                        yRank: { type: 'linear', display: true, position: 'right', reverse: true, min: 1, max: 10, ticks: { stepSize: 1 }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        function renderReviews() {
            const box = document.getElementById('reviews-box');
            const dummyReviews = [
                "「この人が前線にいる時の安心感は異常。スコア稼ぎの天才。」",
                "「対戦で見かけたら即逃げ推奨。キルムーブが凄まじいプレイヤー。」",
                "「ソロでもチームでも安定して上位に食い込んでくる立ち回りの鬼。」"
            ];
            box.innerHTML = dummyReviews.map(r => `<div class="review-card">${r}</div>`).join('');
        }

        document.querySelectorAll('.metric-chk').forEach(chk => chk.addEventListener('change', updateChart));
        window.onload = loadPlayerData;
    </script>
</body>
</html>
