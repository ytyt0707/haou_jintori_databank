<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>個人分析 - 陣取りデータバンク</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 🟩 ランキングページに沿ったダークモダンデザイン */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121214; color: #e0e0e6; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #292930; padding-bottom: 15px; margin-bottom: 25px; }
        .nav-links a { color: #4fa8ff; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
        h1 { margin: 0; font-size: 24px; color: #fff; }
        h2 { font-size: 18px; border-left: 4px solid #4fa8ff; padding-left: 10px; margin-top: 30px; color: #fff; }
        
        /* 📊 テーブルスタイル */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e1e24; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #292930; }
        th { background-color: #25252e; color: #4fa8ff; }
        tr:hover { background-color: #2a2a35; }
        
        /* 🔗 リンク */
        .anal-link { color: #4fa8ff; text-decoration: none; cursor: pointer; }
        .anal-link:hover { text-decoration: underline; }

        /* 順位グリッド */
        .rank-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
        .rank-box { background: #1e1e24; padding: 15px; text-align: center; border-radius: 6px; border: 1px solid #292930; }
        .rank-box .num { font-size: 20px; font-weight: bold; color: #ffbd4f; }

        /* チーム選択チップス */
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .chip { background: #25252e; padding: 6px 12px; border-radius: 20px; font-size: 14px; cursor: pointer; border: 1px solid #3e3e4a; transition: 0.2s; }
        .chip.active { background: #4fa8ff; color: #121214; font-weight: bold; border-color: #4fa8ff; }

        /* 📈 グラフ・人物評エリア */
        .chart-container { background: #1e1e24; padding: 20px; border-radius: 8px; margin-top: 15px; }
        .controls { margin-bottom: 15px; }
        .review-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; }
        .review-card { min-width: 250px; background: #1e1e24; padding: 15px; border-radius: 8px; border-left: 4px solid #ff4f79; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="page-title">個人分析: 読み込み中...</h1>
        <div class="nav-links">
            <a href="ranking.html">🏆 ランキング</a>
            <a href="team.html">🏴 チーム分析一覧</a>
        </div>
    </div>

    <h2>📊 基本統計・計算値</h2>
    <table>
        <thead>
            <tr>
                <th>累計試合数</th>
                <th>平均スコア</th>
                <th>平均キル数</th>
                <th>平均順位</th>
                <th>上位(3位以内)率</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td id="stat-total-games">-</td>
                <td id="stat-avg-score">-</td>
                <td id="stat-avg-kills">-</td>
                <td id="stat-avg-rank">-</td>
                <td id="stat-top3-rate">-</td>
            </tr>
        </tbody>
    </table>

    <h2>🏅 順位別獲得回数 (1位〜10位)</h2>
    <div class="rank-grid" id="rank-distribution">
        </div>

    <h2>🏴 これまでに所属したチーム (クリックでグラフ絞り込み)</h2>
    <div class="chip-container" id="team-chips">
        </div>

    <h2>📈 戦績の推移 (複数選択プロット)</h2>
    <div class="chart-container">
        <div class="controls">
            <label><input type="checkbox" class="metric-chk" value="sc" checked> スコア</label>
            <label style="margin-left:15px;"><input type="checkbox" class="metric-chk" value="k"> キル数</label>
            <label style="margin-left:15px;"><input type="checkbox" class="metric-chk" value="rk"> 順位(逆軸)</label>
        </div>
        <canvas id="historyChart" style="max-height: 350px;"></canvas>
    </div>

    <h2>💬 コミュニティからの人物評</h2>
    <div class="review-scroll" id="reviews-box">
        </div>

    <script>
        // URLからプレイヤー名を取得 (?name=xxx)
        const params = new URLSearchParams(window.location.search);
        const playerName = params.get('name') || "(≡3≡)"; // テスト用のデフォルト

        let rawHistory = [];
        let selectedTeams = [];
        let myChart = null;

        // 禁止文字を変換する安全関数 (Python側と同期)
        function getSafeFilename(name) {
            return name.replace(/[\\/:*?"<>|]/g, '_');
        }

        // データ読み込み
        async function loadPlayerData() {
            try {
                const safeName = getSafeFilename(playerName);
                const response = await fetch(`analysis_data/personal_analysis/${safeName}.json`);
                if (!response.ok) throw new Error("ファイルが見つからないのです");
                const data = await response.json();
                
                document.getElementById('page-title').innerText = `👤 個人分析: ${data.name}`;
                rawHistory = data.h || [];

                // 1. 各種表の計算と表示
                calculateStats(rawHistory);
                // 2. 順位一覧の表示
                renderRankDistribution(rawHistory);
                // 3. チームチップスの作成
                renderTeamChips(rawHistory);
                // 4. グラフの初期描画
                updateChart();
                // 5. 人物評の描画
                renderReviews();

            } catch (err) {
                document.getElementById('page-title').innerText = `❌ データが見つかりませんでした: ${playerName}`;
                console.error(err);
            }
        }

        function calculateStats(history) {
            const total = history.length;
            if(total === 0) return;

            let scoreSum = 0, killSum = 0, rankSum = 0, top3Count = 0;
            history.forEach(item => {
                scoreSum += parseFloat(item.sc || 0);
                killSum += parseInt(item.k || 0);
                rankSum += parseInt(item.rk || 0);
                if(parseInt(item.rk) <= 3) top3Count++;
            });

            document.getElementById('stat-total-games').innerText = `${total} 試合`;
            document.getElementById('stat-avg-score').innerText = (scoreSum / total).toFixed(2);
            document.getElementById('stat-avg-kills').innerText = (killSum / total).toFixed(1);
            document.getElementById('stat-avg-rank').innerText = `${(rankSum / total).toFixed(1)} 位`;
            document.getElementById('stat-top3-rate').innerText = `${((top3Count / total) * 100).toFixed(1)}%`;
        }

        function renderRankDistribution(history) {
            const counts = Array(11).fill(0); // 1~10位用
            history.forEach(item => {
                const r = parseInt(item.rk);
                if(r >= 1 && r <= 10) counts[r]++;
            });

            const container = document.getElementById('rank-distribution');
            container.innerHTML = "";
            for(let i=1; i<=10; i++) {
                container.innerHTML += `
                    <div class="rank-box">
                        <div>${i}位</div>
                        <div class="num">${counts[i]}回</div>
                    </div>
                `;
            }
        }

        function renderTeamChips(history) {
            const teamMap = {};
            history.forEach(item => {
                const t = item.tm || "無所属(SOLO)";
                teamMap[t] = (teamMap[t] || 0) + 1;
            });

            const container = document.getElementById('team-chips');
            container.innerHTML = "";
            Object.keys(teamMap).forEach(team => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = `${team} (${teamMap[team]}回)`;
                chip.addEventListener('click', () => {
                    chip.classList.toggle('active');
                    if(chip.classList.contains('active')) {
                        selectedTeams.push(team);
                    } else {
                        selectedTeams = selectedTeams.filter(t => t !== team);
                    }
                    updateChart(); // グラフ更新
                });
                container.appendChild(chip);
            });
        }

        function updateChart() {
            // チーム選択によるフィルタリング
            let filtered = rawHistory;
            if(selectedTeams.length > 0) {
                filtered = rawHistory.filter(item => {
                    const t = item.tm || "無所属(SOLO)";
                    return selectedTeams.includes(t);
                });
            }

            // 時系列順（ID順）にソート
            filtered.sort((a,b) => a.id - b.id);

            const labels = filtered.map(item => `R-${item.id}`);
            const datasets = [];

            // チェックされている指標を判定
            const chks = document.querySelectorAll('.metric-chk:checked');
            chks.forEach(chk => {
                const val = chk.value;
                if(val === 'sc') {
                    datasets.push({ label: 'スコア', data: filtered.map(item => parseFloat(item.sc)), borderColor: '#4fa8ff', backgroundColor: 'transparent', yAxisID: 'y' });
                } else if(val === 'k') {
                    datasets.push({ label: 'キル数', data: filtered.map(item => item.k), borderColor: '#ff4f79', backgroundColor: 'transparent', yAxisID: 'y1' });
                } else if(val === 'rk') {
                    datasets.push({ label: '順位', data: filtered.map(item => item.rk), borderColor: '#ffbd4f', backgroundColor: 'transparent', yAxisID: 'yRank' });
                }
            });

            if(myChart) myChart.destroy();

            const ctx = document.getElementById('historyChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', grid: { color: '#292930' } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false } },
                        yRank: { type: 'linear', display: true, position: 'right', reverse: true, min: 1, max: 10, ticks: { stepSize: 1 }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        function renderReviews() {
            const box = document.getElementById('reviews-box');
            // 将来的に外部データにするための、とりあえずのたたき台テキスト
            const dummyReviews = [
                "「この人が前線にいる時の安心感は異常。スコア稼ぎの天才。」",
                "「対戦で見かけたら即逃げ推奨。キルムーブが凄まじいプレイヤー。」",
                "「ソロでもチームでも安定して上位に食い込んでくる立ち回りの鬼。」"
            ];
            box.innerHTML = dummyReviews.map(r => `<div class="review-card">${r}</div>`).join('');
        }

        // イベント登録
        document.querySelectorAll('.metric-chk').forEach(chk => chk.addEventListener('change', updateChart));

        window.onload = loadPlayerData;
    </script>
</body>
</html>
