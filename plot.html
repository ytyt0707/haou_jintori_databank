<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数データプロット - 陣取りデータバンク</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
            🎨 ランキングページ共通 超高密度サイバーダークUI
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --excel-border: #444; 
            --highlight: rgba(0, 123, 181, 0.15);
        }
        body { margin: 0; font-family: 'Yomogi', sans-serif; background-color: var(--bg-base); color: var(--text-main); font-size: 0.8rem; }
        
        header { background-color: #111; border-bottom: 1px solid var(--deep-blue); padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .site-title { font-size: 1.1rem; color: var(--deep-blue); margin: 0; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 15px; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--deep-blue); color: #fff; }

        .container { padding: 10px 15px; }
        h2 { font-size: 1rem; color: var(--deep-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px; margin-bottom: 10px; }

        /* 📊 エクセル風テーブルスタイル */
        .table-section { margin-bottom: 15px; overflow-x: auto; }
        .table-title { font-weight: bold; color: var(--deep-blue); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .excel-table { border-collapse: collapse; background-color: var(--bg-panel); width: max-content; margin-top: 5px; }
        .excel-table th, .excel-table td { border: 1px solid var(--excel-border); padding: 4px 8px; text-align: right; white-space: nowrap; }
        .excel-table th { background-color: #111; color: #ccc; font-weight: normal; text-align: center; }
        .excel-table tr:hover { background-color: var(--highlight); }
        .col-left { text-align: left !important; background-color: #111; }

        /* 🎛️ ミニタブボタン (表切り替え用) */
        .mini-tabs { display: flex; gap: 2px; }
        .mini-btn { background: #111; color: #888; border: 1px solid var(--border-color); padding: 2px 8px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.75rem; }
        .mini-btn.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }

        /* 📈 モード切り替えタブ */
        .mode-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { background: #222; color: #aaa; border: 1px solid var(--border-color); padding: 6px 12px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.85rem; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .tab-btn.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }

        /* 🎛️ グラフコントロールエリア */
        .chart-container { background-color: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; }
        .graph-controls { background: #111; padding: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .controls-group { border-right: 1px solid #444; padding-right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .controls-group:last-child { border-right: none; }
        
        input[type="datetime-local"], select, input[type="text"] { background: #000; color: #fff; border: 1px solid #555; padding: 3px; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn { background: #333; color: #fff; border: 1px solid #555; padding: 3px 8px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn:hover { background: #444; }

        /* 🔍 データ選択・検索セクション */
        .search-section { background: #15181f; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .search-container { position: relative; display: inline-block; width: 320px; }
        .search-container input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
        .suggest-box { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid #555; max-height: 250px; overflow-y: auto; z-index: 10; display: none; }
        .suggest-item { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #222; }
        .suggest-item:hover { background: var(--deep-blue); color: #fff; }
        .suggest-global { color: #00ffcc; font-weight: bold; background: #111; }

        /* 🏷️ 比較対象リストバッジ */
        .compare-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .compare-badge { background: #2a303b; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .compare-badge .remove-btn { color: #ff4f79; cursor: pointer; font-weight: bold; margin-left: 5px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html" class="active">複数データプロット</a>
        </div>
    </header>

    <div class="container">
        
        <div class="table-section">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>総試合開催数</th>
                        <th>最大参加人数</th>
                        <th>0人の試合回数</th>
                        <th>総プレイヤー数</th>
                        <th>総チーム数</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><th class="col-left">総計</th><td id="t1-g-m">---</td><td id="t1-g-max">---</td><td id="t1-g-z">---</td><td id="t1-g-p">---</td><td id="t1-g-t">---</td></tr>
                    <tr><th class="col-left">ソロ戦</th><td id="t1-s-m">---</td><td id="t1-s-max">---</td><td id="t1-s-z">---</td><td id="t1-s-p">---</td><td></td></tr>
                    <tr><th class="col-left">チーム戦</th><td id="t1-m-m">---</td><td id="t1-m-max">---</td><td id="t1-m-z">---</td><td id="t1-m-p">---</td><td id="t1-m-t">---</td></tr>
                </tbody>
            </table>
        </div>

        <div class="table-section">
            <div class="table-title">
                <span>📅 時間別試合参加人数</span>
                <div class="mini-tabs">
                    <button class="mini-btn active" id="btn-time-all" onclick="switchTimeTable('all')">総計</button>
                    <button class="mini-btn" id="btn-time-1" onclick="switchTimeTable('1')">月</button>
                    <button class="mini-btn" id="btn-time-2" onclick="switchTimeTable('2')">火</button>
                    <button class="mini-btn" id="btn-time-3" onclick="switchTimeTable('3')">水</button>
                    <button class="mini-btn" id="btn-time-4" onclick="switchTimeTable('4')">木</button>
                    <button class="mini-btn" id="btn-time-5" onclick="switchTimeTable('5')">金</button>
                    <button class="mini-btn" id="btn-time-6" onclick="switchTimeTable('6')">土</button>
                    <button class="mini-btn" id="btn-time-0" onclick="switchTimeTable('0')">日</button>
                </div>
            </div>
            <div style="overflow-x: auto; max-width: 100%;">
                <table class="excel-table" id="time-hourly-table">
                    <thead>
                        <tr id="time-header-hours"><th class="col-left">時間</th></tr>
                        <tr id="time-header-avgs"><th class="col-left">平均人数</th></tr>
                    </thead>
                </table>
            </div>
        </div>

        <h2>📈 複数データプロット比較</h2>

        <div class="mode-tabs">
            <button class="tab-btn" id="btn-mode-normal" onclick="switchGraphMode('normal')">🕒 通常経過時間モード</button>
            <button class="tab-btn active" id="btn-mode-hourly" onclick="switchGraphMode('hourly')">📊 1日時間平均モード</button>
        </div>

        <div class="chart-container">
            <div class="graph-controls">
                <div id="controls-normal" class="controls-group hidden">
                    <label>期間:</label>
                    <input type="datetime-local" id="date-start"> ～ <input type="datetime-local" id="date-end">
                    <button class="btn" onclick="setPresetDate('1d')">直近1日</button>
                    <button class="btn" onclick="setPresetDate('1w')">直近1週間</button>
                    <button class="btn" onclick="setPresetDate('1m')">直近1か月</button>
                    <button class="btn" onclick="setPresetDate('all')">全期間</button>
                    <label style="margin-left: 10px;">スケール:</label>
                    <select id="graph-scale" onchange="updateChart()">
                        <option value="hour">1時間毎</option>
                        <option value="day" selected>1日毎</option>
                        <option value="week">1週間毎</option>
                        <option value="month">1か月毎</option>
                    </select>
                </div>

                <div id="controls-hourly" class="controls-group">
                    <label>曜日フィルター:</label>
                    <select id="hourly-day-filter" onchange="updateChart()">
                        <option value="all" selected>全曜日 (月〜日)</option>
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                        <option value="6">土曜日</option>
                        <option value="0">日曜日</option>
                    </select>
                </div>
            </div>

            <div class="search-section">
                <div style="margin-bottom: 8px; font-weight: bold; color: #ccc;">🔍 比較するデータ・プレイヤー・チームを検索：</div>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="名前を入力（試合数も横に出るのです）..." oninput="onSearchInput()" onclick="onSearchInput()">
                    <div id="suggest-box" class="suggest-box"></div>
                </div>
                
                <div class="compare-list" id="compare-badge-container"></div>
            </div>

            <div style="position: relative; height: 450px;">
                <canvas id="multiHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'hourly'; // 💡 デフォルトを「1日時間平均」に変更
        let gameAnalyticsData = null;
        let masterTargets = {};       
        let activeCompareList = [];   
        let myChart = null;

        const personalDataOptions = [
            { id: 'area_avg', label: '平均獲得面積(%)', unit: '％/毎試合' },
            { id: 'kill_avg', label: '平均キル数', unit: 'キル/毎試合' },
            { id: 'matches', label: '参加回数(試合数)', unit: '回/毎時' } 
        ];

        const colors = ['#00ffcc', '#ff4f79', '#ffea00', '#4fa8ff', '#ff8800', '#cc0000', '#bbff00', '#ffffff'];
        function getColor(index) { return colors[index % colors.length]; }

        window.onload = async function() {
            await loadGameAnalytics();
            await loadMasterTargets();
            initDatePresets(); // 💡 全期間の自動検出・初期化
            
            await addCompareTarget("試合参加人数", "global", true);
            
            document.addEventListener('click', function(e) {
                if (e.target.id !== 'search-input') {
                    document.getElementById('suggest-box').style.display = 'none';
                }
            });
        };

        function initDatePresets() {
            let sd = new Date();
            sd.setDate(sd.getDate() - 7);
            let ed = new Date();

            if (gameAnalyticsData && gameAnalyticsData.t && gameAnalyticsData.t.length > 0) {
                sd = new Date(gameAnalyticsData.t[0].d);
                ed = new Date(gameAnalyticsData.t[gameAnalyticsData.t.length - 1].d);
            }
            const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
            document.getElementById('date-start').value = fmt(sd);
            document.getElementById('date-end').value = fmt(ed);
        }

        function setPresetDate(preset) {
            if (!gameAnalyticsData || !gameAnalyticsData.t || gameAnalyticsData.t.length === 0) return;
            const lastDataDate = new Date(gameAnalyticsData.t[gameAnalyticsData.t.length - 1].d);
            
            let ed = new Date(lastDataDate);
            let sd = new Date(lastDataDate);
            
            if(preset === '1d') sd.setDate(sd.getDate() - 1);
            if(preset === '1w') sd.setDate(sd.getDate() - 7);
            if(preset === '1m') sd.setMonth(sd.getMonth() - 1);
            if(preset === 'all') {
                sd = new Date(gameAnalyticsData.t[0].d);
            }
            const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
            document.getElementById('date-start').value = fmt(sd);
            document.getElementById('date-end').value = fmt(ed);
            updateChart();
        }

        async function loadGameAnalytics() {
            try {
                const response = await fetch('analysis_data/game_analytics.json');
                if (!response.ok) throw new Error();
                gameAnalyticsData = await response.json();
                
                if (gameAnalyticsData && gameAnalyticsData.t) {
                    let gSum = [0,0,0,0,0], sSum = [0,0,0,0], mSum = [0,0,0,0,0];
                    gameAnalyticsData.t.forEach(b => {
                        if(b.g) { gSum[0]+=b.g[0]||0; gSum[1]=Math.max(gSum[1],b.g[1]||0); gSum[2]+=b.g[2]||0; gSum[3]+=b.g[3]||0; gSum[4]+=b.g[4]||0; }
                        if(b.s) { sSum[0]+=b.s[0]||0; sSum[1]=Math.max(sSum[1],b.s[1]||0); sSum[2]+=b.s[2]||0; sSum[3]+=b.s[3]||0; }
                        if(b.m) { mSum[0]+=b.m[0]||0; mSum[1]=Math.max(mSum[1],b.m[1]||0); mSum[2]+=b.m[2]||0; mSum[3]+=b.m[3]||0; mSum[4]+=b.m[4]||0; }
                    });
                    document.getElementById('t1-g-m').innerText = gSum[0];
                    document.getElementById('t1-g-max').innerText = gSum[1];
                    document.getElementById('t1-g-z').innerText = gSum[2];
                    document.getElementById('t1-g-p').innerText = gSum[3];
                    document.getElementById('t1-g-t').innerText = gSum[4];
                    document.getElementById('t1-s-m').innerText = sSum[0];
                    document.getElementById('t1-s-max').innerText = sSum[1];
                    document.getElementById('t1-s-z').innerText = sSum[2];
                    document.getElementById('t1-s-p').innerText = sSum[3];
                    document.getElementById('t1-m-m').innerText = mSum[0];
                    document.getElementById('t1-m-max').innerText = mSum[1];
                    document.getElementById('t1-m-z').innerText = mSum[2];
                    document.getElementById('t1-m-p').innerText = mSum[3];
                    document.getElementById('t1-m-t').innerText = mSum[4];

                    switchTimeTable('all');
                }
            } catch (e) { console.log("統計データ読込例外", e); }
        }

        function switchTimeTable(dayFilter) {
            ['all','1','2','3','4','5','6','0'].forEach(d => document.getElementById(`btn-time-${d}`).classList.toggle('active', d===dayFilter));
            if (!gameAnalyticsData || !gameAnalyticsData.t) return;

            const hourlyTotal = Array(24).fill(0);
            const hourlyMatchCount = Array(24).fill(0);

            gameAnalyticsData.t.forEach(b => {
                const d = new Date(b.d);
                if (dayFilter !== 'all' && d.getDay().toString() !== dayFilter) return;
                const hour = d.getHours();
                hourlyTotal[hour] += (b.g ? (b.g[3] || 0) : 0);
                hourlyMatchCount[hour]++;
            });

            const trHours = document.getElementById('time-header-hours');
            const trAvgs = document.getElementById('time-header-avgs');
            trHours.innerHTML = '<th class="col-left">時間</th>';
            trAvgs.innerHTML = '<th class="col-left">平均人数</th>';

            for (let h = 0; h < 24; h++) {
                const avg = hourlyMatchCount[h] > 0 ? (hourlyTotal[h] / hourlyMatchCount[h]).toFixed(1) : "0.0";
                trHours.innerHTML += `<th>${h}時</th>`;
                trAvgs.innerHTML += `<td>${avg}人</td>`;
            }
        }

        // 💡 検索窓用マスター構築：インデックス5(row[5])を参照して、重複する名前は合算
        async function loadMasterTargets() {
            try {
                const response = await fetch('public_data/all_period/summary.json');
                if (!response.ok) throw new Error();
                const data = await response.json();
                masterTargets = {};
                if (data && data.rankings) {
                    data.rankings.forEach(row => {
                        const type = row[0];  
                        const name = row[1];  
                        const matches = parseInt(row[5]) || 0; // 💡 5番目の配列要素から試合数をパース
                        if (!name) return;
                        
                        let targetType = (type === 'tp' || type === 'sp') ? 'personal' : 'team';
                        
                        // 💡 同一プレイヤー名・チーム名があれば試合数を足し算して集計
                        if (masterTargets[name]) {
                            masterTargets[name].totalMatches += matches;
                        } else {
                            masterTargets[name] = { type: targetType, totalMatches: matches };
                        }
                    });
                }
            } catch(e) { console.log("マスターデータ読込失敗", e); }
        }

        function onSearchInput() {
            const val = document.getElementById('search-input').value.toLowerCase().trim();
            const suggestBox = document.getElementById('suggest-box');
            suggestBox.innerHTML = '';

            const globalDiv = document.createElement('div');
            globalDiv.className = 'suggest-item suggest-global';
            globalDiv.innerText = `📊 【全体】 試合参加人数`;
            globalDiv.onclick = () => addCompareTarget("試合参加人数", "global");
            suggestBox.appendChild(globalDiv);

            let count = 0;
            Object.keys(masterTargets).forEach(name => {
                if (count >= 15) return;
                if (name.toLowerCase().includes(val) || val === '') {
                    const info = masterTargets[name];
                    const div = document.createElement('div');
                    div.className = 'suggest-item';
                    div.innerText = `[${info.type === 'personal' ? '個人' : 'チーム'}] ${name} (${info.totalMatches}試合)`;
                    div.onclick = () => addCompareTarget(name, info.type);
                    suggestBox.appendChild(div);
                    count++;
                }
            });
            suggestBox.style.display = 'block';
        }

        function getSafeFilename(name) { return name.replace(/[\\/:*?"<>|]/g, '_'); }

        async function fetchTargetData(type, name) {
            if (type === 'global') return gameAnalyticsData;
            const safeName = getSafeFilename(name);
            const folder = type === 'personal' ? 'personal_analysis' : 'team_analysis';
            try {
                const response = await fetch(`analysis_data/${folder}/${safeName}.json`);
                if (!response.ok) throw new Error();
                return await response.json();
            } catch(e) { return null; }
        }

        async function addCompareTarget(name, type, isInitial = false) {
            if (activeCompareList.some(i => i.name === name && i.type === type)) return;

            let loadedJson = isInitial ? gameAnalyticsData : await fetchTargetData(type, name);
            
            let matchCounts = { total: 0, solo: 0, team_all: 0 };
            let teamMatchCounts = {};

            if (type === 'personal' && loadedJson && loadedJson.h) {
                matchCounts.total = loadedJson.h.length;
                loadedJson.h.forEach(r => {
                    if (r.md === 'SOLO' || r.is_solo === true) matchCounts.solo++;
                    else {
                        matchCounts.team_all++;
                        const tName = r.tm || "無所属(TEAM)";
                        teamMatchCounts[tName] = (teamMatchCounts[tName] || 0) + 1;
                    }
                });
            } else if (type === 'team' && loadedJson && loadedJson.h) {
                matchCounts.total = loadedJson.h.length;
            }

            // 💡 デフォルト値：個人・チームの場合は「参加回数(matches)」をデフォルト値として選定
            let defaultDataType = type === 'global' ? 'total_players' : 'matches';

            activeCompareList.push({
                name: name,
                type: type,
                matchType: 'total',
                datatype: defaultDataType, 
                matchCounts: matchCounts,
                teamMatchCounts: teamMatchCounts,
                cachedData: loadedJson 
            });

            document.getElementById('search-input').value = '';
            document.getElementById('suggest-box').style.display = 'none';
            
            renderCompareBadges();
            updateChart();
        }

        function removeCompareTarget(index) {
            activeCompareList.splice(index, 1);
            renderCompareBadges();
            updateChart();
        }

        function onMatchTypeChange(index, value) {
            activeCompareList[index].matchType = value;
            updateChart();
        }

        function onDataTypeChange(index, value) {
            activeCompareList[index].datatype = value;
            updateChart();
        }

        function renderCompareBadges() {
            const container = document.getElementById('compare-badge-container');
            container.innerHTML = '';

            activeCompareList.forEach((item, index) => {
                const badge = document.createElement('div');
                badge.className = 'compare-badge';
                badge.style.borderLeft = `4px solid ${getColor(index)}`;

                let controlsHtml = '';
                if (currentMode === 'hourly') {
                    // 💡 1日時間平均モード
                    if (item.type === 'global') {
                        controlsHtml = `<span style="color:#00ffcc;">時間別試合参加人数</span>`;
                    } else {
                        let matchSelect = `<select onchange="onMatchTypeChange(${index}, this.value)">
                            <option value="total" ${item.matchType==='total'?'selected':''}>総合 (${item.matchCounts.total}回)</option>`;
                        if (item.type === 'personal') {
                            matchSelect += `<option value="solo" ${item.matchType==='solo'?'selected':''}>ソロ戦 (${item.matchCounts.solo}回)</option>`;
                            matchSelect += `<option value="team_all" ${item.matchType==='team_all'?'selected':''}>チーム戦全体 (${item.matchCounts.team_all}回)</option>`;
                            Object.entries(item.teamMatchCounts).forEach(([tName, count]) => {
                                matchSelect += `<option value="team_${tName}" ${item.matchType===`team_${tName}`?'selected':''}>チーム: ${tName} (${count}回)</option>`;
                            });
                        }
                        matchSelect += `</select>`;

                        // 💡 1日時間平均モードの時は、個人/チームの項目は「参加回数」固定にする
                        item.datatype = 'matches'; 
                        let dataSelect = `<select disabled><option value="matches" selected>参加回数(試合数)</option></select>`;
                        
                        controlsHtml = matchSelect + dataSelect;
                    }
                } else {
                    // 通常経過時間モード
                    if (item.type === 'global') {
                        controlsHtml = `<span style="color:#00ffcc;">全体: 試合参加人数</span>`;
                    } else {
                        let matchSelect = `<select onchange="onMatchTypeChange(${index}, this.value)">
                            <option value="total" ${item.matchType==='total'?'selected':''}>総合 (${item.matchCounts.total}回)</option>`;
                        if (item.type === 'personal') {
                            matchSelect += `<option value="solo" ${item.matchType==='solo'?'selected':''}>ソロ戦 (${item.matchCounts.solo}回)</option>`;
                            matchSelect += `<option value="team_all" ${item.matchType==='team_all'?'selected':''}>チーム戦全体 (${item.matchCounts.team_all}回)</option>`;
                            Object.entries(item.teamMatchCounts).forEach(([tName, count]) => {
                                matchSelect += `<option value="team_${tName}" ${item.matchType===`team_${tName}`?'selected':''}>チーム: ${tName} (${count}回)</option>`;
                            });
                        }
                        matchSelect += `</select>`;

                        let dataSelect = `<select onchange="onDataTypeChange(${index}, this.value)">`;
                        personalDataOptions.forEach(opt => {
                            dataSelect += `<option value="${opt.id}" ${item.datatype === opt.id ? 'selected' : ''}>${opt.label}</option>`;
                        });
                        dataSelect += `</select>`;
                        controlsHtml = matchSelect + dataSelect;
                    }
                }

                badge.innerHTML = `
                    <span>[${item.type==='global'?'全体':(item.type==='personal'?'個人':'チーム')}] <strong>${item.name}</strong></span>
                    ${controlsHtml}
                    <span class="remove-btn" onclick="removeCompareTarget(${index})">×</span>
                `;
                container.appendChild(badge);
            });
        }

        function switchGraphMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('btn-mode-hourly').classList.toggle('active', mode === 'hourly');
            document.getElementById('controls-normal').classList.toggle('hidden', mode === 'hourly');
            document.getElementById('controls-hourly').classList.toggle('hidden', mode === 'normal');
            renderCompareBadges();
            updateChart();
        }

        function truncDate(d, scale) {
            const t = new Date(d);
            t.setMinutes(0,0,0);
            if(['day','week','month'].includes(scale)) t.setHours(0);
            if(scale === 'week') t.setDate(t.getDate() - t.getDay());
            if(scale === 'month') t.setDate(1);
            return t;
        }

        function addTime(d, scale) {
            const t = new Date(d);
            if(scale === 'hour') t.setHours(t.getHours()+1);
            if(scale === 'day') t.setDate(t.getDate()+1);
            if(scale === 'week') t.setDate(t.getDate()+7);
            if(scale === 'month') t.setMonth(t.getMonth()+1);
            return t;
        }

        function formatLabel(d) {
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function updateChart() {
            const chartDatasets = [];
            const yAxesConfig = {}; 
            const scale = document.getElementById('graph-scale').value;

            if (currentMode === 'normal') {
                const sdStr = document.getElementById('date-start').value;
                const edStr = document.getElementById('date-end').value;

                const sd = sdStr ? new Date(sdStr) : null;
                const ed = edStr ? new Date(edStr) : null;
                let maxEnd = ed || new Date();
                let minStart = sd || new Date(maxEnd.getTime() - 7*24*60*60*1000);

                const finalTimestamps = [];
                let curr = truncDate(minStart, scale);
                let endLimit = truncDate(maxEnd, scale);
                while(curr <= endLimit) {
                    finalTimestamps.push(curr.getTime());
                    curr = addTime(curr, scale);
                }
                const commonLabels = finalTimestamps.map(ts => formatLabel(new Date(ts)));

                const targetProcessedBuckets = [];
                activeCompareList.forEach((item, idx) => {
                    const rawJson = item.cachedData;
                    if (!rawJson) return;

                    let history = [];
                    if (item.type === 'global') {
                        if (rawJson.t) history = rawJson.t.filter(b => (!sd || new Date(b.d) >= sd) && (!ed || new Date(b.d) <= ed));
                    } else {
                        if (rawJson.h) history = rawJson.h.filter(r => (!sd || new Date(r.at) >= sd) && (!ed || r.at <= edStr));
                        if (item.type === 'personal') {
                            if (item.matchType === 'solo') history = history.filter(r => r.md === 'SOLO' || r.is_solo === true);
                            else if (item.matchType === 'team_all') history = history.filter(r => r.md === 'TEAM' || r.is_solo === false);
                            else if (item.matchType.startsWith('team_')) {
                                const targetTeam = item.matchType.substring(5);
                                history = history.filter(r => (r.md === 'TEAM' || r.is_solo === false) && (r.tm || "無所属(TEAM)") === targetTeam);
                            }
                        }
                    }

                    const buckets = {};
                    history.forEach(r => {
                        const d = new Date(item.type === 'global' ? r.d : r.at);
                        const ts = truncDate(d, scale).getTime();
                        if (!buckets[ts]) buckets[ts] = [];
                        buckets[ts].push(r);
                    });

                    targetProcessedBuckets.push({ item, idx, buckets });
                });

                const unitToAxisMap = {};

                targetProcessedBuckets.forEach(({ item, idx, buckets }) => {
                    const dataPoints = [];

                    finalTimestamps.forEach(ts => {
                        const records = buckets[ts] || [];
                        if (records.length === 0) {
                            dataPoints.push(0);
                        } else {
                            let yVal = 0;
                            if (item.type === 'global') {
                                const sum = records.reduce((acc, b) => acc + (b.g ? (b.g[3]||0) : 0), 0);
                                yVal = scale === 'hour' ? records[0].g[3] : sum / records.length;
                            } else {
                                if (item.datatype === 'area_avg') {
                                    yVal = records.reduce((acc, r) => acc + parseFloat(item.type === 'personal' ? (r.sc||0) : (r.ts||0)), 0) / records.length;
                                } else if (item.datatype === 'kill_avg') {
                                    yVal = records.reduce((acc, r) => acc + parseInt(item.type === 'personal' ? (r.k||0) : (r.tk||0)), 0) / records.length;
                                } else if (item.datatype === 'matches') {
                                    yVal = records.length;
                                }
                            }
                            dataPoints.push(yVal);
                        }
                    });

                    let unitKey = "人";
                    if (item.type !== 'global') {
                        if (item.datatype === 'area_avg') unitKey = "％/毎試合";
                        else if (item.datatype === 'kill_avg') unitKey = "キル/毎試合";
                        else if (item.datatype === 'matches') unitKey = `回/${scale==='hour'?'時':scale==='day'?'日':scale==='week'?'週':'月'}`;
                    }

                    if (!unitToAxisMap[unitKey]) {
                        unitToAxisMap[unitKey] = {
                            axisId: `y-axis-${Object.keys(unitToAxisMap).length}`,
                            colors: []
                        };
                    }
                    unitToAxisMap[unitKey].colors.push(getColor(idx));
                    const currentAxisId = unitToAxisMap[unitKey].axisId;

                    chartDatasets.push({
                        label: `[${item.type==='global'?'全':(item.matchType==='total'?'総':(item.matchType==='solo'?'ソ':'チ'))}] ${item.name}`,
                        data: dataPoints,
                        borderColor: getColor(idx),
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHitRadius: 10,
                        tension: 0.1,
                        spanGaps: true,
                        yAxisID: currentAxisId
                    });
                });

                Object.entries(unitToAxisMap).forEach(([unitStr, axisInfo], orderIdx) => {
                    yAxesConfig[axisInfo.axisId] = {
                        type: 'linear',
                        display: true,
                        position: orderIdx === 0 ? 'left' : 'right',
                        grid: { color: orderIdx === 0 ? '#333' : 'transparent', drawOnChartArea: orderIdx === 0 },
                        title: { display: true, text: unitStr, color: '#ccc', font: { family: 'Yomogi', size: 10 } },
                        ticks: {
                            font: { family: 'Yomogi', size: 10 },
                            color: context => axisInfo.colors[0] || '#ccc'
                        }
                    };
                });

                renderChartJs(chartDatasets, commonLabels, yAxesConfig);

            } else {
                // ==================== 📊 1日時間平均モード ====================
                const dayFilter = document.getElementById('hourly-day-filter').value;
                const hoursLabels = Array.from({length: 24}, (_, i) => `${i}時台`);
                const unitToAxisMap = {};

                activeCompareList.forEach((item, idx) => {
                    const rawJson = item.cachedData;
                    if (!rawJson) return;

                    const hourlySum = Array(24).fill(0);
                    const hourlyCounts = Array(24).fill(0);

                    if (item.type === 'global') {
                        if (rawJson.t) {
                            rawJson.t.forEach(b => {
                                const d = new Date(b.d);
                                if (dayFilter !== 'all' && d.getDay().toString() !== dayFilter) return;
                                const hour = d.getHours();
                                hourlySum[hour] += (b.g ? (b.g[3] || 0) : 0);
                                hourlyCounts[hour]++;
                            });
                            for(let i=0; i<24; i++) hourlySum[i] = hourlyCounts[i] > 0 ? (hourlySum[i] / hourlyCounts[i]) : 0;
                        }
                    } else {
                        if (rawJson.h) {
                            let history = rawJson.h;
                            if (item.type === 'personal') {
                                if (item.matchType === 'solo') history = history.filter(r => r.md === 'SOLO' || r.is_solo === true);
                                else if (item.matchType === 'team_all') history = history.filter(r => r.md === 'TEAM' || r.is_solo === false);
                                else if (item.matchType.startsWith('team_')) {
                                    const targetTeam = item.matchType.substring(5);
                                    history = history.filter(r => (r.md === 'TEAM' || r.is_solo === false) && (r.tm || "無所属(TEAM)") === targetTeam);
                                }
                            }
                            
                            history.forEach(r => {
                                const d = new Date(r.at);
                                if (dayFilter !== 'all' && d.getDay().toString() !== dayFilter) return;
                                const hour = d.getHours();
                                
                                // 💡 1日時間平均モードでは、個人/チームは「参加回数」に集約
                                hourlySum[hour]++;
                            });
                        }
                    }

                    let unitKey = item.type === 'global' ? "人" : "回/毎時分布";

                    if (!unitToAxisMap[unitKey]) {
                        unitToAxisMap[unitKey] = {
                            axisId: `y-axis-${Object.keys(unitToAxisMap).length}`,
                            colors: []
                        };
                    }
                    unitToAxisMap[unitKey].colors.push(getColor(idx));
                    const currentAxisId = unitToAxisMap[unitKey].axisId;

                    chartDatasets.push({
                        label: `[${item.type==='global'?'全':(item.matchType==='total'?'総':(item.matchType==='solo'?'ソ':'チ'))}] ${item.name}`,
                        data: hourlySum,
                        borderColor: getColor(idx),
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: 3,
                        tension: 0.1,
                        yAxisID: currentAxisId
                    });
                });

                Object.entries(unitToAxisMap).forEach(([unitStr, axisInfo], orderIdx) => {
                    yAxesConfig[axisInfo.axisId] = {
                        type: 'linear',
                        display: true,
                        position: orderIdx === 0 ? 'left' : 'right',
                        grid: { color: orderIdx === 0 ? '#333' : 'transparent', drawOnChartArea: orderIdx === 0 },
                        title: { display: true, text: unitStr, color: '#ccc', font: { family: 'Yomogi', size: 10 } },
                        ticks: {
                            font: { family: 'Yomogi', size: 10 },
                            color: context => axisInfo.colors[0] || '#ccc'
                        }
                    };
                });

                renderChartJs(chartDatasets, hoursLabels, yAxesConfig);
            }
        }

        function renderChartJs(datasets, labels, yAxesConfig) {
            if(myChart) myChart.destroy();
            const scale = document.getElementById('graph-scale') ? document.getElementById('graph-scale').value : 'day';

            myChart = new Chart(document.getElementById('multiHistoryChart').getContext('2d'), {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            type: 'category',
                            grid: { color: '#333' },
                            ticks: { color: '#ccc', font: { family: 'Yomogi' } }
                        },
                        ...yAxesConfig
                    },
                    plugins: {
                        legend: { labels: { color: '#ccc', font: { family: 'Yomogi' } } },
                        tooltip: {
                            bodyFont: { family: 'Yomogi' },
                            titleFont: { family: 'Yomogi' },
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        let val = context.parsed.y % 1 === 0 ? context.parsed.y : context.parsed.y.toFixed(2);
                                        const datasetIndex = context.datasetIndex;
                                        const currentItem = activeCompareList[datasetIndex];
                                        
                                        if (currentItem && currentItem.type === 'global') {
                                            val += '人';
                                        } else if (currentItem) {
                                            if (currentItem.datatype === 'area_avg') val += '％/毎試合';
                                            else if (currentItem.datatype === 'kill_avg') val += 'キル/毎試合';
                                            else if (currentItem.datatype === 'matches') {
                                                if (currentMode === 'hourly') {
                                                    val += '回/毎時分布';
                                                } else {
                                                    const scaleUnit = scale === 'hour' ? '時' : scale === 'day' ? '日' : scale === 'week' ? '週' : '月';
                                                    val += `回/毎${scaleUnit}`;
                                                }
                                            }
                                        }
                                        return label + val;
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
