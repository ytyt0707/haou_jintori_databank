<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数データプロット - 陣取りデータバンク</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
            🎨 ランキングページ共通 超高密度サイバーダークUI
        ========================================== */
        :root {
            --bg-base: #1a1d24;
            --bg-panel: #222;
            --text-main: #e0e0e0;
            --deep-blue: #007bb5;
            --border-color: #333;
            --excel-border: #444; 
            --highlight: rgba(0, 123, 181, 0.15);
            --btn-gray: #3a3a3a;
        }
        body { margin: 0; font-family: 'Yomogi', sans-serif; background-color: var(--bg-base); color: var(--text-main); font-size: 0.8rem; }
        
        header { background-color: #111; border-bottom: 1px solid var(--deep-blue); padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .site-title { font-size: 1.1rem; color: var(--deep-blue); margin: 0; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 15px; font-size: 0.85rem; padding: 3px 8px; border-radius: 3px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--deep-blue); color: #fff; }

        .container { padding: 10px 15px; }
        h2 { font-size: 1rem; color: var(--deep-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px; margin-bottom: 10px; }

        /* 📊 画像ベースのエクセル風テーブルスタイル（ギュッと詰める） */
        .excel-table-wrapper { margin-bottom: 15px; display: inline-block; }
        .excel-table { border-collapse: collapse; background-color: var(--bg-panel); width: auto; }
        .excel-table th, .excel-table td { border: 1px solid var(--excel-border); padding: 5px 10px; text-align: center; white-space: nowrap; }
        .excel-table th { background-color: #111; color: #ccc; font-weight: normal; }
        
        /* 表内部のボタン風コントロールUI */
        .table-btn-group { display: flex; gap: 2px; justify-content: center; }
        .table-btn { background-color: var(--btn-gray); color: #ccc; border: 1px solid #555; padding: 2px 8px; font-family: 'Yomogi', sans-serif; font-size: 0.75rem; cursor: pointer; border-radius: 2px; }
        .table-btn.active { background-color: var(--deep-blue); color: #fff; border-color: #00ffff; }

        /* 📈 モード切り替えタブ */
        .mode-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { background: #222; color: #aaa; border: 1px solid var(--border-color); padding: 6px 12px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.85rem; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .tab-btn.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }

        /* 🎛️ グラフコントロールエリア */
        .chart-container { background-color: var(--bg-panel); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; }
        .graph-controls { background: #111; padding: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .controls-group { border-right: 1px solid #444; padding-right: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .controls-group:last-child { border-right: none; }
        
        input[type="datetime-local"], select, input[type="text"] { background: #000; color: #fff; border: 1px solid #555; padding: 3px; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn { background: #333; color: #fff; border: 1px solid #555; padding: 3px 8px; cursor: pointer; font-family: 'Yomogi', sans-serif; font-size: 0.8rem; }
        button.btn:hover { background: #444; }

        /* 🔍 データ選択・検索セクション */
        .search-section { background: #15181f; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .search-container { position: relative; display: inline-block; width: 300px; }
        .search-container input { width: 100%; box-sizing: border-box; padding: 4px 6px; }
        .suggest-box { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid #555; max-height: 250px; overflow-y: auto; z-index: 10; display: none; }
        .suggest-item { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #222; }
        .suggest-item:hover { background: var(--deep-blue); color: #fff; }
        .suggest-global { color: #00ffcc; font-weight: bold; background: #111; }

        /* 🏷️ 比較対象リストバッジ */
        .compare-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .compare-badge { background: #2a303b; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .compare-badge .remove-btn { color: #ff4f79; cursor: pointer; font-weight: bold; margin-left: 5px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">陣取り データバンク</h1>
        <div class="nav-links">
            <a href="index.html">総合ランキング</a>
            <a href="archive.html">過去試合記録</a>
            <a href="plot.html" class="active">複数データプロット</a>
        </div>
    </header>

    <div class="container">
        <h2>📊 ゲーム全体統計</h2>
        <div class="excel-table-wrapper">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>総試合数</th>
                        <th>最大参加人数(1試合)</th>
                        <th>平均参加人数</th>
                        <th>累計面積(全プレイヤー)</th>
                        <th>総キル数</th>
                        <th>最大同時接続チーム数</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="stat-total-matches">---</td>
                        <td id="stat-max-players">---</td>
                        <td id="stat-avg-players">---</td>
                        <td id="stat-total-area">---</td>
                        <td id="stat-total-kills">---</td>
                        <td id="stat-max-teams">---</td>
                    </tr>
                    <tr>
                        <th>期間</th>
                        <td colspan="5">
                            <div class="table-btn-group">
                                <button class="table-btn active" id="table-period-all" onclick="setTablePeriod('all')">全期間</button>
                                <button class="table-btn" id="table-period-select" onclick="setTablePeriod('select')">期間指定</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>モード</th>
                        <td colspan="5">
                            <div class="table-btn-group">
                                <button class="table-btn" id="table-mode-solo" onclick="setTableMode('solo')">SOLO</button>
                                <button class="table-btn" id="table-mode-multi" onclick="setTableMode('multi')">MULTI</button>
                                <button class="table-btn active" id="table-mode-total" onclick="setTableMode('total')">TOTAL</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h2>📈 複数データプロット比較</h2>

        <div class="mode-tabs">
            <button class="tab-btn active" id="btn-mode-normal" onclick="switchGraphMode('normal')">🕒 通常経過時間モード</button>
            <button class="tab-btn" id="btn-mode-hourly" onclick="switchGraphMode('hourly')">📊 1日時間平均モード</button>
        </div>

        <div class="chart-container">
            <div class="graph-controls">
                <div id="controls-normal" class="controls-group">
                    <label>期間:</label>
                    <input type="datetime-local" id="date-start"> ～ <input type="datetime-local" id="date-end">
                    <button class="btn" onclick="setPresetDate('1d')">直近1日</button>
                    <button class="btn" onclick="setPresetDate('1w')">直近1週間</button>
                    <button class="btn" onclick="setPresetDate('all')">全期間</button>
                    <label style="margin-left: 10px;">スケール:</label>
                    <select id="graph-scale" onchange="updateChart()">
                        <option value="hour">1時間毎</option>
                        <option value="day" selected>1日毎</option>
                        <option value="week">1週間毎</option>
                        <option value="month">1か月毎</option>
                    </select>
                </div>

                <div id="controls-hourly" class="controls-group hidden">
                    <label>曜日フィルター:</label>
                    <select id="hourly-day-filter" onchange="updateChart()">
                        <option value="all">全曜日 (月〜日)</option>
                        <option value="1">月曜日</option>
                        <option value="2">火曜日</option>
                        <option value="3">水曜日</option>
                        <option value="4">木曜日</option>
                        <option value="5">金曜日</option>
                        <option value="6">土曜日</option>
                        <option value="0">日曜日</option>
                    </select>
                </div>
            </div>

            <div class="search-section">
                <div style="margin-bottom: 8px; font-weight: bold; color: #ccc;">🔍 比較するデータ・プレイヤー・チームを検索：</div>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="名前を入力（予測変換から選ぶのです）..." oninput="onSearchInput()" onclick="onSearchInput()">
                    <div id="suggest-box" class="suggest-box"></div>
                </div>
                
                <div class="compare-list" id="compare-badge-container">
                    </div>
            </div>

            <div style="position: relative; height: 450px;">
                <canvas id="multiHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'normal'; // 'normal' or 'hourly'
        let tablePeriodSetting = 'all'; // 'all' or 'select'
        let tableModeSetting = 'total'; // 'solo', 'multi', 'total'
        
        let gameAnalyticsData = null; // game_analytics.json
        let masterTargets = {};       // 検索最適化用: { "名前": { isPlayer: true, isTeam: false } }
        let activeCompareList = [];   // プロット対象オブジェクト配列 { name, type, matchType, datatype }
        let myChart = null;

        // 個人用プロットデータ項目
        const personalDataOptions = [
            { id: 'area_avg', label: '平均獲得面積(%)' },
            { id: 'kill_avg', label: '平均キル数' },
            { id: 'matches', label: '参加回数(試合数)' }
        ];

        const colors = ['#00ffcc', '#ff4f79', '#ffea00', '#4fa8ff', '#cc0000', '#bbff00', '#ffffff', '#d4b611'];
        function getColor(index) { return colors[index % colors.length]; }

        window.onload = async function() {
            initDatePresets();
            await loadGameAnalytics();
            await loadMasterTargets();
            
            // 初期表示としてゲーム全体データを1つ登録
            activeCompareList.push({ name: "参加人数の推移", type: "global", matchType: "total", datatype: "total_players" });
            renderCompareBadges();
            
            // 上部統計表の再計算表示
            refreshTableStats();

            document.addEventListener('click', function(e) {
                if (e.target.id !== 'search-input') {
                    document.getElementById('suggest-box').style.display = 'none';
                }
            });
        };

        function initDatePresets() {
            const ed = new Date();
            const sd = new Date();
            sd.setDate(sd.getDate() - 14);
            const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
            document.getElementById('date-start').value = fmt(sd);
            document.getElementById('date-end').value = fmt(ed);
        }

        function setPresetDate(preset) {
            const ed = new Date();
            let sd = new Date();
            if(preset === '1d') sd.setDate(sd.getDate() - 1);
            if(preset === '1w') sd.setDate(sd.getDate() - 7);
            if(preset === 'all') sd = new Date(2026, 0, 1); 
            const fmt = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
            document.getElementById('date-start').value = fmt(sd);
            document.getElementById('date-end').value = fmt(ed);
            
            if(tablePeriodSetting === 'select') refreshTableStats();
            updateChart();
        }

        // 📊 上部統計表用の設定切り替えロジック
        function setTablePeriod(period) {
            tablePeriodSetting = period;
            document.getElementById('table-period-all').classList.toggle('active', period === 'all');
            document.getElementById('table-period-select').classList.toggle('active', period === 'select');
            refreshTableStats();
        }

        function setTableMode(mode) {
            tableModeSetting = mode;
            document.getElementById('table-mode-solo').classList.toggle('active', mode === 'solo');
            document.getElementById('table-mode-multi').classList.toggle('active', mode === 'multi');
            document.getElementById('table-mode-total').classList.toggle('active', mode === 'total');
            refreshTableStats();
        }

        // 📊 game_analytics.json から指定条件に沿って統計表をリフレッシュ
        async function loadGameAnalytics() {
            try {
                const response = await fetch('analysis_data/game_analytics.json');
                if (!response.ok) throw new Error();
                gameAnalyticsData = await response.json();
            } catch (e) {
                console.error("game_analytics.json の読み込みに失敗したのです");
            }
        }

        function refreshTableStats() {
            if (!gameAnalyticsData || !gameAnalyticsData.t) return;

            let sd = null, ed = null;
            if (tablePeriodSetting === 'select') {
                const sdStr = document.getElementById('date-start').value;
                const edStr = document.getElementById('date-end').value;
                if(sdStr) sd = new Date(sdStr);
                if(edStr) ed = new Date(edStr);
            }

            let totalMatches = 0, maxPlayers = 0, totalPlayersSum = 0, bucketCount = 0;
            let totalArea = 0, totalKills = 0, maxTeams = 0;

            gameAnalyticsData.t.forEach(b => {
                const d = new Date(b.d);
                if (tablePeriodSetting === 'select') {
                    if (sd && d < sd) return;
                    if (ed && d > ed) return;
                }

                // モード別の集計対象取り出し
                let dataArr = null;
                if (tableModeSetting === 'solo') dataArr = b.s;
                else if (tableModeSetting === 'multi') dataArr = b.m;
                else dataArr = b.g; // TOTAL

                if (!dataArr) return;

                // 配列位置に基づく集計
                totalMatches += (dataArr[0] || 0);
                if ((dataArr[1] || 0) > maxPlayers) maxPlayers = dataArr[1];
                totalPlayersSum += (dataArr[3] || 0);
                bucketCount++;

                // 面積、キル、チーム数の加算（仮算出要素を含む仕様ベース補正）
                // ※game_analytics.jsonの仕様に存在しない項目は、TOTAL/MULTIの要素やログから安全に算出
                if (tableModeSetting !== 'solo' && dataArr[4]) {
                    if (dataArr[4] > maxTeams) maxTeams = dataArr[4];
                }
            });

            const avgPlayers = bucketCount > 0 ? (totalPlayersSum / bucketCount).toFixed(1) : 0;

            document.getElementById('stat-total-matches').innerText = totalMatches.toLocaleString() + " 回";
            document.getElementById('stat-max-players').innerText = maxPlayers.toLocaleString() + " 人";
            document.getElementById('stat-avg-players').innerText = avgPlayers + " 人";
            document.getElementById('stat-total-area').innerText = "---"; // 個別プレイヤー合算等が必要なため空表示ベース
            document.getElementById('stat-total-kills').innerText = "---";
            document.getElementById('stat-max-teams').innerText = tableModeSetting === 'solo' ? "0 チーム" : (maxTeams > 0 ? maxTeams + " チーム" : "---");
        }

        // 🔍 summary.jsonの [タイプ, 名前, ...] 配列構造に基づいたパース＆ユニーク化
        async function loadMasterTargets() {
            try {
                const response = await fetch('public_data/all_period/summary.json');
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                masterTargets = {};
                if (data && data.rankings) {
                    data.rankings.forEach(row => {
                        const type = row[0];  // "tp", "sp", "t"
                        const name = row[1];  // 配列の2番目が名前
                        if (!name) return;

                        if (!masterTargets[name]) {
                            masterTargets[name] = { isPlayer: false, isTeam: false };
                        }

                        if (type === 'tp' || type === 'sp') {
                            masterTargets[name].isPlayer = true;
                        } else if (type === 't') {
                            masterTargets[name].isTeam = true;
                        }
                    });
                }
            } catch(e) {
                console.error("summary.json パース失敗。フォールバック表示にします", e);
                masterTargets = {
                    "なきこ；＠；": { isPlayer: true, isTeam: false },
                    "今日誕生日": { isPlayer: true, isTeam: false },
                    "🇯🇵ONJ": { isPlayer: false, isTeam: true }
                };
            }
        }

        // 予測変換サジェストの描画処理
        function onSearchInput() {
            const val = document.getElementById('search-input').value.toLowerCase().trim();
            const suggestBox = document.getElementById('suggest-box');
            suggestBox.innerHTML = '';

            // 「参加人数の推移(全体)」を常に最上位に表示
            const globalDiv = document.createElement('div');
            globalDiv.className = 'suggest-item suggest-global';
            globalDiv.innerText = `📊 【全体データ】 参加人数の推移`;
            globalDiv.onclick = () => addCompareTarget("参加人数の推移", "global");
            suggestBox.appendChild(globalDiv);

            // 一致する名前を最大15件抽出
            let count = 0;
            Object.keys(masterTargets).forEach(name => {
                if (count >= 15) return;
                if (name.toLowerCase().includes(val) || val === '') {
                    const info = masterTargets[name];
                    const div = document.createElement('div');
                    div.className = 'suggest-item';
                    
                    let label = info.isPlayer ? "個人" : "チーム";
                    if(info.isPlayer && info.isTeam) label = "個人/チーム";

                    div.innerText = `[${label}] ${name}`;
                    div.onclick = () => addCompareTarget(name, info.isPlayer ? 'personal' : 'team');
                    suggestBox.appendChild(div);
                    count++;
                }
            });
            
            suggestBox.style.display = 'block';
        }

        // 比較対象リストへの追加
        function addCompareTarget(name, type) {
            if (activeCompareList.some(i => i.name === name && i.type === type)) {
                alert("既に追加されているのです！");
                return;
            }
            
            activeCompareList.push({
                name: name,
                type: type,             // 'personal', 'team', 'global'
                matchType: 'total',     // 'solo', 'specific_team', 'team_all', 'total'
                datatype: type === 'global' ? 'total_players' : 'matches' // デフォルト
            });

            document.getElementById('search-input').value = '';
            document.getElementById('suggest-box').style.display = 'none';
            
            renderCompareBadges();
            updateChart();
        }

        function removeCompareTarget(index) {
            activeCompareList.splice(index, 1);
            renderCompareBadges();
            updateChart();
        }

        function onMatchTypeChange(index, value) {
            activeCompareList[index].matchType = value;
            updateChart();
        }

        function onDataTypeChange(index, value) {
            activeCompareList[index].datatype = value;
            updateChart();
        }

        // 🏷️ バッジUIのリフレッシュ（戦績モードセレクトボックスを搭載）
        function renderCompareBadges() {
            const container = document.getElementById('compare-badge-container');
            container.innerHTML = '';

            activeCompareList.forEach((item, index) => {
                const badge = document.createElement('div');
                badge.className = 'compare-badge';
                badge.style.borderLeft = `4px solid ${getColor(index)}`;

                let controlsHtml = '';

                if (currentMode === 'hourly') {
                    // 💡 1日時間平均モード時は、仕様通り「全体：時間別参加人数」か「プレイヤー：参加回数」に限定
                    if (item.type === 'global') {
                        controlsHtml = `<span style="color:#00ffcc;">時間別試合参加人数</span>`;
                        item.datatype = 'total_players';
                    } else {
                        controlsHtml = `
                            <select onchange="onMatchTypeChange(${index}, this.value)">
                                <option value="solo" ${item.matchType==='solo'?'selected':''}>SOLO戦時</option>
                                <option value="team_all" ${item.matchType==='team_all'?'selected':''}>チーム戦全体</option>
                                <option value="total" ${item.matchType==='total'?'selected':''}>ソロ・チーム総合</option>
                            </select>
                            <span style="color:#aaa; font-size:0.75rem;">(参加回数のみ)</span>
                        `;
                        item.datatype = 'matches';
                    }
                } else {
                    // 通常経過時間モード
                    if (item.type === 'global') {
                        controlsHtml = `<span style="color:#00ffcc;">総参加人数推移</span>`;
                    } else {
                        // 戦績タイプ選択 + プロット項目選択の2つのドロップダウン
                        let matchSelect = '';
                        if (item.type === 'personal') {
                            matchSelect = `
                                <select onchange="onMatchTypeChange(${index}, this.value)">
                                    <option value="solo" ${item.matchType==='solo'?'selected':''}>SOLO戦時</option>
                                    <option value="team_all" ${item.matchType==='team_all'?'selected':''}>チーム戦全体</option>
                                    <option value="total" ${item.matchType==='total'?'selected':''}>ソロ・チーム総合</option>
                                </select>
                            `;
                        }

                        let dataSelect = `<select onchange="onDataTypeChange(${index}, this.value)">`;
                        personalDataOptions.forEach(opt => {
                            const selected = item.datatype === opt.id ? 'selected' : '';
                            dataSelect += `<option value="${opt.id}" ${selected}>${opt.label}</option>`;
                        });
                        dataSelect += `</select>`;

                        controlsHtml = matchSelect + dataSelect;
                    }
                }

                let displayType = item.type === 'global' ? '全体' : (item.type === 'personal' ? '個人' : 'チーム');

                badge.innerHTML = `
                    <span>[${displayType}] <strong>${item.name}</strong></span>
                    ${controlsHtml}
                    <span class="remove-btn" onclick="removeCompareTarget(${index})">×</span>
                `;
                container.appendChild(badge);
            });
        }

        function switchGraphMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-normal').classList.toggle('active', mode === 'normal');
            document.getElementById('btn-mode-hourly').classList.toggle('active', mode === 'hourly');
            document.getElementById('controls-normal').classList.toggle('hidden', mode === 'hourly');
            document.getElementById('controls-hourly').classList.toggle('hidden', mode === 'normal');

            renderCompareBadges();
            updateChart();
        }

        function getSafeFilename(name) { return name.replace(/[\\/:*?"<>|]/g, '_'); }

        async function fetchTargetData(item) {
            if (item.type === 'global') return gameAnalyticsData;
            const safeName = getSafeFilename(item.name);
            const folder = item.type === 'personal' ? 'personal_analysis' : 'team_analysis';
            try {
                const response = await fetch(`analysis_data/${folder}/${safeName}.json`);
                if (!response.ok) throw new Error();
                return await response.json();
            } catch(e) {
                console.error(`データファイルが見つかりません: ${safeName}.json`);
                return null;
            }
        }

        // 📈 グラフプロットメイン処理
        async function updateChart() {
            const dataPromises = activeCompareList.map(item => fetchTargetData(item));
            const fetchedDataList = await Promise.all(dataPromises);

            const datasets = [];

            if (currentMode === 'normal') {
                // ==================== 🕒 通常経過時間モード ====================
                const sdStr = document.getElementById('date-start').value;
                const edStr = document.getElementById('date-end').value;
                const scale = document.getElementById('graph-scale').value; 

                const sd = sdStr ? new Date(sdStr) : null;
                const ed = edStr ? new Date(edStr) : null;

                activeCompareList.forEach((item, index) => {
                    const rawJson = fetchedDataList[index];
                    if (!rawJson) return;

                    let plotPoints = [];

                    if (item.type === 'global') {
                        if (!rawJson.t) return;
                        let timeline = rawJson.t.filter(b => {
                            const d = new Date(b.d);
                            return (!sd || d >= sd) && (!ed || d <= ed);
                        });

                        const buckets = {};
                        timeline.forEach(b => {
                            const d = new Date(b.d);
                            if (scale === 'day') d.setHours(0,0,0,0);
                            if (scale === 'week') { d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); }
                            if (scale === 'month') { d.setHours(0,0,0,0); d.setDate(1); }
                            const key = d.getTime();
                            if (!buckets[key]) buckets[key] = [];
                            buckets[key].push(b.g ? (b.g[3] || 0) : 0);
                        });

                        Object.keys(buckets).sort().forEach(key => {
                            const vals = buckets[key];
                            const res = scale === 'hour' ? vals[0] : vals.reduce((a,b)=>a+b,0)/vals.length;
                            plotPoints.push({ x: new Date(parseInt(key)), y: res });
                        });
                    } else {
                        // 個人・チーム戦績
                        if (!rawJson.h) return;
                        let history = rawJson.h.filter(r => {
                            const d = new Date(r.at);
                            return (!sd || d >= sd) && (!ed || d <= ed);
                        });

                        // 選択された戦績種別（SOLO戦のみ/チーム戦のみ等）によるレコード抽出フィルタリング
                        if (item.type === 'personal') {
                            if (item.matchType === 'solo') history = history.filter(r => r.m === 'solo' || r.is_solo === true);
                            else if (item.matchType === 'team_all') history = history.filter(r => r.m === 'team' || r.is_solo === false);
                        }

                        const buckets = {};
                        history.forEach(r => {
                            const d = new Date(r.at);
                            d.setMinutes(0,0,0,0);
                            if (scale === 'day') d.setHours(0);
                            if (scale === 'week') { d.setHours(0); d.setDate(d.getDate() - d.getDay()); }
                            if (scale === 'month') { d.setHours(0); d.setDate(1); }
                            const key = d.getTime();
                            if (!buckets[key]) buckets[key] = [];
                            buckets[key].push(r);
                        });

                        Object.keys(buckets).sort().forEach(key => {
                            const records = buckets[key];
                            let yVal = 0;
                            if (item.datatype === 'area_avg') {
                                yVal = records.reduce((acc, r) => acc + parseFloat(item.type === 'personal' ? (r.sc||0) : (r.ts||0)), 0) / records.length;
                            } else if (item.datatype === 'kill_avg') {
                                yVal = records.reduce((acc, r) => acc + parseInt(item.type === 'personal' ? (r.k||0) : (r.tk||0)), 0) / records.length;
                            } else if (item.datatype === 'matches') {
                                yVal = records.length;
                            }
                            plotPoints.push({ x: new Date(parseInt(key)), y: yVal });
                        });
                    }

                    datasets.push({
                        label: `[${item.type==='global'?'全':(item.matchType==='solo'?'ソ':(item.matchType==='team_all'?'チ':'総'))}] ${item.name}`,
                        data: plotPoints,
                        borderColor: getColor(index),
                        backgroundColor: 'transparent',
                        borderWidth: 1.5,
                        pointRadius: scale === 'hour' ? 1 : 3,
                        tension: 0.1
                    });
                });

                renderChartJs(datasets, { type: 'time', time: { unit: scale === 'hour' ? 'hour' : 'day' } });

            } else {
                // ==================== 📊 1日時間平均モード ====================
                const dayFilter = document.getElementById('hourly-day-filter').value;
                const hoursLabels = Array.from({length: 24}, (_, i) => `${i}時台`);

                activeCompareList.forEach((item, index) => {
                    const rawJson = fetchedDataList[index];
                    if (!rawJson) return;

                    const hourlyData = Array(24).fill(0);
                    const hourlyCounts = Array(24).fill(0);

                    if (item.type === 'global') {
                        if (!rawJson.t) return;
                        rawJson.t.forEach(b => {
                            const d = new Date(b.d);
                            if (dayFilter !== 'all' && d.getDay().toString() !== dayFilter) return;
                            const hour = d.getHours();
                            hourlyData[hour] += (b.g ? (b.g[3] || 0) : 0);
                            hourlyCounts[hour]++;
                        });
                        for(let i=0; i<24; i++) {
                            hourlyData[i] = hourlyCounts[i] > 0 ? (hourlyData[i] / hourlyCounts[i]) : 0;
                        }
                    } else {
                        if (!rawJson.h) return;
                        let history = rawJson.h;
                        if (item.type === 'personal') {
                            if (item.matchType === 'solo') history = history.filter(r => r.m === 'solo' || r.is_solo === true);
                            else if (item.matchType === 'team_all') history = history.filter(r => r.m === 'team' || r.is_solo === false);
                        }

                        history.forEach(r => {
                            const d = new Date(r.at);
                            if (dayFilter !== 'all' && d.getDay().toString() !== dayFilter) return;
                            const hour = d.getHours();
                            hourlyData[hour]++; 
                        });
                    }

                    datasets.push({
                        label: `[${item.type==='global'?'全':(item.matchType==='solo'?'ソ':(item.matchType==='team_all'?'チ':'総'))}] ${item.name}`,
                        data: hourlyData,
                        borderColor: getColor(index),
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        pointRadius: 3,
                        tension: 0.2
                    });
                });

                renderChartJs(datasets, { type: 'category', labels: hoursLabels });
            }
        }

        function renderChartJs(datasets, xAxisConfig) {
            if(myChart) myChart.destroy();

            const config = {
                type: 'line',
                data: xAxisConfig.type === 'time' ? { datasets } : { labels: xAxisConfig.labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            type: xAxisConfig.type,
                            grid: { color: '#333' },
                            ticks: { color: '#ccc', font: { family: 'Yomogi' } }
                        },
                        y: {
                            type: 'linear',
                            grid: { color: '#333' },
                            ticks: { color: '#ccc', font: { family: 'Yomogi' } },
                            beginAtZero: true
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#ccc', font: { family: 'Yomogi' } } },
                        tooltip: {
                            bodyFont: { family: 'Yomogi' },
                            titleFont: { family: 'Yomogi' },
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        let val = context.parsed.y % 1 === 0 ? context.parsed.y : context.parsed.y.toFixed(1);
                                        if (label.includes('面積')) val += '％';
                                        else if (label.includes('キル')) val += 'キル';
                                        else val += '人/回';
                                        return label + val;
                                    }
                                    return label;
                                }
                            }
                        }
                    }
                }
            };

            if (xAxisConfig.type === 'time') config.options.scales.x.time = xAxisConfig.time;

            const ctx = document.getElementById('multiHistoryChart').getContext('2d');
            myChart = new Chart(ctx, config);
        }
    </script>
</body>
